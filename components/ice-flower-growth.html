<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice Flower</title>
<style>
  :root{
    --pale:#e9fbfc;
    --aqua:#7fd9e4;
    --line:#4fb9c9;
    --deep:#0b3a4e;
    --panel:#bfeef2;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;
    background:var(--pale);
    overflow:hidden;
    cursor:pointer;
  }
  #grade{
    position:fixed;inset:0;
    pointer-events:none;
    z-index:2;
    opacity:.58;
    mix-blend-mode:multiply;
  }
  #fx{
    position:fixed;inset:0;
    width:100%;height:100%;
    display:block;
    z-index:1;
  }
</style>
</head>
<body>
  <div id="grade" aria-hidden="true"></div>
  <canvas id="fx" aria-label="A computer drafting an ice-blue flower from particles, construction lines, and binary digits"></canvas>
  <script>
(function(){
  const qs = new URLSearchParams(location.search);
  const STILL = qs.has('still');
  const AT = (() => { const v = parseFloat(qs.get('t')); return Number.isFinite(v) ? v : null; })();
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const pale = '#e9fbfc';
  const aqua = '#7fd9e4';
  const line = '#4fb9c9';
  const deep = '#0b3a4e';
  const D = Math.PI / 180;
  const cvs = document.getElementById('fx');
  const ctx = cvs.getContext('2d', { alpha: false });

  (function grain(){
    const N = 159, c = document.createElement('canvas');
    c.width = c.height = N;
    const x = c.getContext('2d'), img = x.createImageData(N, N), a = img.data;
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0, y = 0; y < N; y++) for (let e = 0; e < N; e++, i += 4) {
      const r = rnd();
      let v = [0, 0, 0, 0];
      if (r < 0.1) v = [10, 48, 72, 13 + rnd() * 18];
      else if (r < 0.18) v = [255, 255, 255, 28 + rnd() * 40];
      if (r > 0.2 && r < 0.206) v = [80, 210, 220, 64];
      if (y % 3 === 2 && v[3] < 8) v = [10, 50, 78, 8];
      a[i] = v[0]; a[i + 1] = v[1]; a[i + 2] = v[2]; a[i + 3] = v[3];
    }
    x.putImageData(img, 0, 0);
    const G = document.getElementById('grade');
    G.style.backgroundImage = `url(${c.toDataURL()})`;
    if ((devicePixelRatio || 1) >= 1.5) G.style.backgroundSize = `${N / 2}px ${N / 2}px`;
  })();

  const clamp = (v,a,b)=> v<a?a:v>b?b:v;
  const lerp = (a,b,t)=> a+(b-a)*t;
  const smooth = t => { t=clamp(t,0,1); return t*t*(3-2*t); };
  const smoother = t => { t=clamp(t,0,1); return t*t*t*(t*(t*6-15)+10); };
  const gate = (t,a,b)=> smooth((t-a)/(b-a||1e-6));
  const v3 = (x,y,z)=>({x,y,z});
  const add = (a,b)=> v3(a.x+b.x,a.y+b.y,a.z+b.z);
  const sub = (a,b)=> v3(a.x-b.x,a.y-b.y,a.z-b.z);
  const mul = (a,s)=> v3(a.x*s,a.y*s,a.z*s);
  const dot = (a,b)=> a.x*b.x+a.y*b.y+a.z*b.z;
  const cross = (a,b)=> v3(a.y*b.z-a.z*b.y, a.z*b.x-a.x*b.z, a.x*b.y-a.y*b.x);
  const len = a => Math.hypot(a.x,a.y,a.z);
  const norm = a => { const L=len(a)||1; return mul(a,1/L); };
  function rotX(p,a){ const c=Math.cos(a),s=Math.sin(a); return v3(p.x, p.y*c-p.z*s, p.y*s+p.z*c); }
  function rotY(p,a){ const c=Math.cos(a),s=Math.sin(a); return v3(p.x*c+p.z*s, p.y, -p.x*s+p.z*c); }
  function rotZ(p,a){ const c=Math.cos(a),s=Math.sin(a); return v3(p.x*c-p.y*s, p.x*s+p.y*c, p.z); }
  function rotAxis(p, axis, ang){
    const u=norm(axis), c=Math.cos(ang), s=Math.sin(ang), k=dot(u,p);
    return add(add(mul(p,c), mul(cross(u,p),s)), mul(u, k*(1-c)));
  }
  function bez(p0,p1,p2,p3,t){
    const u=1-t, uu=u*u, tt=t*t;
    return add(add(add(mul(p0,uu*u), mul(p1,3*uu*t)), mul(p2,3*u*tt)), mul(p3,tt*t));
  }
  function bezDt(p0,p1,p2,p3,t){
    const u=1-t;
    return add(add(mul(sub(p1,p0),3*u*u), mul(sub(p2,p1),6*u*t)), mul(sub(p3,p2),3*t*t));
  }
  /* deterministic noise */
  function hash(n){
    n = (n | 0) * 1597334677;
    n = (n ^ (n >>> 16)) * 2246822519;
    n = (n ^ (n >>> 13)) * 3266489917;
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  function rgba(hex, a){
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  let W=0,H=0,DPR=1,S=1,CX=0,CY=0;
  const CAM_Y = 16*D, CAM_X = 22*D;

  function project(p){
    let q = rotY(p, CAM_Y);
    q = rotX(q, CAM_X);
    return { x: CX + q.x * S, y: CY - q.y * S, z: q.z };
  }

  function fit(){
    W = innerWidth; H = innerHeight;
    DPR = Math.min(devicePixelRatio||1, 2);
    cvs.width = Math.round(W*DPR);
    cvs.height = Math.round(H*DPR);
    cvs.style.width = W+'px';
    cvs.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    S = Math.min(W,H) * 0.90 / 640;
    CX = W * 0.51;
    CY = H * 0.84;
  }

  /* ---- flower rig (used as a particle field, never filled) ---- */
  const STEM = {
    p0: v3(  4,   0,  8),
    p1: v3( 36, 148,  4),
    p2: v3(-34, 300,-12),
    p3: v3(  2, 412,  2)
  };
  function stemPoint(u){ return bez(STEM.p0,STEM.p1,STEM.p2,STEM.p3,u); }
  function stemTan(u){ return norm(bezDt(STEM.p0,STEM.p1,STEM.p2,STEM.p3,u)); }
  function noise1(t, freq, id, salt){
    const u = t*freq + id*0.17 + salt;
    const i = Math.floor(u);
    const f = u - i;
    const a = hash(i*97 + id + salt*19)*2-1;
    const b = hash((i+1)*97 + id + salt*19)*2-1;
    const s = f*f*(3-2*f);
    return a*(1-s)+b*s;
  }
  /* each particle jitters in a tiny neighbourhood of itself — not a plant-wide sway */
  function jitter(pt, t){
    if (!pt.jig || STILL || RM || AT!=null || t < pt.born) return {x:0,y:0};
    const freq = pt.glyph ? 8 : 6.5;
    const ax = 0.82 * (S/1.05);
    const ay = 0.30 * (S/1.05);
    return { x: noise1(t, freq, pt.id, 1)*ax, y: noise1(t, freq*0.84, pt.id, 2)*ay };
  }

  const LEAVES = [
    { kind:'leaf', node:0.34, az:-56*D, len:188, wid:44, cup:9,  openLean:50*D, twist:-10*D, bend:22, delay:0 },
    { kind:'leaf', node:0.58, az:128*D, len:152, wid:34, cup:7,  openLean:48*D, twist:  8*D, bend:-16, delay:0.22 }
  ];
  const PETALS = [
    { kind:'tepal', az: 10*D, len:158, wid:78, cup:36, openLean:46*D, twist: 5*D, delay:0.00, whorl:0 },
    { kind:'tepal', az:130*D, len:152, wid:74, cup:34, openLean:44*D, twist:-4*D, delay:0.05, whorl:0 },
    { kind:'tepal', az:250*D, len:156, wid:76, cup:35, openLean:45*D, twist: 4*D, delay:0.09, whorl:0 },
    { kind:'tepal', az: 50*D, len:140, wid:66, cup:40, openLean:36*D, twist: 3*D, delay:0.22, whorl:1 },
    { kind:'tepal', az:170*D, len:134, wid:62, cup:38, openLean:34*D, twist:-5*D, delay:0.26, whorl:1 },
    { kind:'tepal', az:290*D, len:138, wid:64, cup:39, openLean:35*D, twist: 3*D, delay:0.30, whorl:1 },
    { kind:'tepal', az: 30*D, len:116, wid:50, cup:32, openLean:20*D, twist: 2*D, delay:0.42, whorl:2 },
    { kind:'tepal', az:150*D, len:110, wid:48, cup:30, openLean:18*D, twist:-3*D, delay:0.46, whorl:2 },
    { kind:'tepal', az:270*D, len:114, wid:49, cup:31, openLean:19*D, twist: 3*D, delay:0.50, whorl:2 }
  ];

  function widthProf(kind, u){
    u = clamp(u,0,1);
    if (kind==='leaf'){
      const body = Math.sin(Math.pow(u,0.72)*Math.PI);
      let w = 0.10 + 0.90*Math.pow(body,0.95);
      if (u>0.82){ const t=(u-0.82)/0.18; w*=Math.sqrt(Math.max(0,1-t*t)); }
      return w;
    }
    const body = Math.sin(Math.pow(u,0.62)*Math.PI);
    let w = 0.20 + 0.80*Math.pow(body,0.62);
    if (u>0.70){ const t=(u-0.70)/0.30; w*=Math.sqrt(Math.max(0,1-t*t)); }
    return w;
  }
  function bladePoint(u, v, spec, lean, origin, upAxis){
    const prof = widthProf(spec.kind||'tepal', u);
    const x = v*spec.wid*0.5*prof + (spec.bend||0)*u*u;
    const y = u*spec.len;
    const z = -(spec.cup||0)*Math.sin(u*Math.PI)*(1-v*v*0.35);
    let p = v3(x,y,z);
    if (spec.twist) p = rotY(p, spec.twist*u);
    p = rotZ(p, -lean);
    p = rotY(p, spec.az);
    if (upAxis){
      const up=norm(upAxis), worldUp=v3(0,1,0);
      const axis=cross(worldUp,up);
      const aa=Math.acos(clamp(dot(worldUp,up),-1,1));
      if (len(axis)>1e-5 && aa>1e-5) p = rotAxis(p, axis, aa);
    }
    return add(origin, p);
  }

  const T = {
    frame0: 0.00, frame1: 1.05,
    stemFrame0: 0.80, stemFrame1: 2.00,
    stem0: 2.00, stem1: 5.05,
    bud0: 10.80, bud1: 13.00,
    open0: 13.10, open1: 23.02,
    idle: 23.80
  };
  const PETAL_FRAME = 0.58;
  const PETAL_OPEN = 0.70;
  const PETAL_STEP = 1.08; /* next frame starts near the end of the current unfurl */
  const LEAF_T = [
    { frame0: 5.25, frame1: 6.30, grow0: 6.30, grow1: 7.92 },
    { frame0: 7.75, frame1: 8.70, grow0: 8.70, grow1: 10.25 }
  ];

  function leafGrow(t,i){ return smoother(gate(t, LEAF_T[i].grow0, LEAF_T[i].grow1)); }
  function leafFrame(t,i){
    const L = LEAF_T[i];
    const spread = smoother(gate(t, L.frame0, L.frame1));
    const appear = smoother(gate(t, L.frame0, L.frame0+0.22));
    const fade = 1 - smoother(gate(t, L.grow1, L.grow1+0.95));
    return { spread, alpha: appear * fade };
  }
  function petalPhase(t, i){
    const spec = PETALS[i];
    const bud = smoother(gate(t, T.bud0, T.bud1));
    const f0 = T.open0 + i * PETAL_STEP;
    const f1 = f0 + PETAL_FRAME;
    const g0 = f1;
    const g1 = g0 + PETAL_OPEN;
    const open = smoother(gate(t, g0, g1));
    const frameSpread = smoother(gate(t, f0, f1));
    const appear = smoother(gate(t, f0, f0+0.20));
    const fade = 1 - smoother(gate(t, g1, g1+0.70));
    return { bud, open, frameSpread, frameA: appear*fade, f0, f1, g0, g1, spec };
  }

  /* ---- particles (built once, then revealed by time) ---- */
  const parts = [];
  function seed(){
    parts.length = 0;
    let id = 1;
    const push = (p) => {
      p.id = id++;
      const chance = p.glyph ? 0.40 : (p.kind==='dust' ? 0.30 : 0.26);
      p.jig = hash(p.id*67+11) < chance;
      parts.push(p);
    };

    /* stem */
    for (let i=0;i<340;i++){
      const u = Math.pow(hash(i*19+3), 0.85);
      const ang = hash(i*23+7)*Math.PI*2;
      const rad = (hash(i*29+1)**0.7) * lerp(6.0, 2.2, u);
      const tng = stemTan(u);
      let side = cross(tng, v3(0.1,0,1));
      if (len(side)<1e-4) side = cross(tng, v3(1,0,0));
      side = norm(side);
      const up = norm(cross(side, tng));
      const p = add(stemPoint(u), add(mul(side, Math.cos(ang)*rad*0.16), mul(up, Math.sin(ang)*rad*0.16)));
      const glyph = hash(i*41+5) < 0.22 ? (hash(i*43+2)<0.5?'0':'1') : null;
      push({ kind:'stem', u, p, born: lerp(T.stem0, T.stem1, u)+hash(i)*0.18, settle: 0.5+hash(i*3)*0.55, glyph, size: glyph?1: lerp(2.0, 1.15, u), col: hash(i*11)<0.35?deep:line });
    }

    /* leaves */
    LEAVES.forEach((spec, li) => {
      const n = li===0? 300 : 240;
      for (let i=0;i<n;i++){
        const u = hash(li*1000+i*17+2);
        const v = (hash(li*1000+i*31+4)*2-1) * 0.96;
        const origin0 = stemPoint(spec.node);
        const up0 = stemTan(spec.node);
        const glyph = hash(li*800+i*13)<0.24 ? (hash(i*21)<0.5?'0':'1') : null;
        push({
          kind:'leaf', li, u, v, originU: spec.node,
          born: LEAF_T[li].grow0 + u*(LEAF_T[li].grow1-LEAF_T[li].grow0)*0.88 + hash(i)*0.28,
          settle: 0.45+hash(i*5)*0.7,
          glyph, size: glyph?1: lerp(1.85, 1.2, u),
          col: hash(i*7)<0.4?deep:aqua
        });
      }
    });

    /* petals */
    PETALS.forEach((spec, pi) => {
      const n = spec.whorl===0? 260 : spec.whorl===1? 220 : 180;
      for (let i=0;i<n;i++){
        let u = Math.pow(hash(pi*2000+i*17+9), 0.7);
        let v = (hash(pi*2000+i*29+3)*2-1);
        /* bias a third of the points onto the rim so the petal silhouette holds */
        if (hash(pi*2000+i*7) < 0.34) v = (hash(i*5)<0.5?-1:1) * (0.86+hash(i*9)*0.14);
        if (hash(pi*2000+i*5) < 0.16) u = 0.78 + hash(i*3)*0.22;
        v *= 0.98;
        const glyph = hash(pi*1700+i*11)<0.26 ? (hash(i*19)<0.5?'0':'1') : null;
        push({
          kind:'petal', pi, u, v,
          born: T.bud0 + u*(T.bud1-T.bud0)*0.88 + spec.delay*0.9 + hash(i)*0.25,
          settle: 0.45+hash(i*9)*0.7,
          glyph, size: glyph?1: lerp(1.9, 1.25, u),
          col: spec.whorl===2?deep:(hash(i*3)<0.45?line:aqua)
        });
      }
    });

    /* loose field motes around the plant — computational dust */
    for (let i=0;i<56;i++){
      const p = v3((hash(i*3)-0.5)*140, hash(i*5)*460, (hash(i*7)-0.5)*60);
      push({
        kind:'dust', p,
        born: lerp(0.4, 19.5, hash(i*11)),
        settle: 0.35+hash(i)*1.0,
        glyph: hash(i*13)<0.40 ? (hash(i*17)<0.5?'0':'1') : null,
        size: 1,
        col: hash(i)<0.5?deep:line,
        wander: hash(i*19)
      });
    }
  }

  function worldOf(pt, t){
    if (pt.kind==='stem' || pt.kind==='dust'){
      if (pt.kind==='dust') return pt.p;
      return pt.p;
    }
    if (pt.kind==='leaf'){
      const spec = LEAVES[pt.li];
      const g = leafGrow(t, pt.li);
      if (g<=0) return null;
      const origin = stemPoint(spec.node);
      const up = stemTan(spec.node);
      const lean = lerp(8*D, spec.openLean, g);
      const grown = Object.assign({}, spec, { len: spec.len*lerp(0.16,1,g), wid: spec.wid*lerp(0.10,1,Math.pow(g,0.75)) });
      return bladePoint(pt.u, pt.v, grown, lean, origin, up);
    }
    if (pt.kind==='petal'){
      const spec = PETALS[pt.pi];
      const ph = petalPhase(t, pt.pi);
      if (ph.bud<=0) return null;
      const origin = stemPoint(1);
      const up = stemTan(1);
      const lean = lerp(6*D, spec.openLean, ph.open);
      const grow = smoother(ph.bud);
      const grown = Object.assign({}, spec, { len: spec.len*lerp(0.48,1,grow), wid: spec.wid*lerp(0.40,1,grow) });
      return bladePoint(pt.u, pt.v, grown, lean, origin, up);
    }
    return null;
  }

  /* flicker: frequent while a particle is being written; still blinks after it settles */
  function flick(pt, t){
    if (RM || STILL) return 1;
    const age = t - pt.born;
    if (age < 0) return 0;
    const cell = Math.floor(t * (pt.glyph ? 16 : 13) + pt.id * 0.17);
    const n = hash(cell * 97 + pt.id);
    const n2 = hash(cell * 13 + pt.id * 3);
    if (age < pt.settle){
      /* writing: hard on/off flicker */
      if (n < 0.38) return 0;
      if (n2 < 0.18) return 0.25;
      return 1;
    }
    /* settled: still frequent small blinks, glyphs more often */
    const rate = pt.glyph ? 0.14 : 0.07;
    if (n < rate) return n < rate*0.45 ? 0 : 0.2;
    return 1;
  }

  /* ---- construction / design drawings ---- */
  function artboard(){
    /* a design plate around the plant, in screen space */
    const top = project(v3(0, 600, 0));
    const base = project(v3(0, -20, 0));
    const padX = 170 * S / 1.1;
    const x0 = CX - padX, x1 = CX + padX;
    const y0 = top.y - 36, y1 = base.y + 48;
    return { x0, y0, x1, y1, w: x1-x0, h: y1-y0 };
  }

  function drawCropMark(x, y, dx, dy, a){
    ctx.strokeStyle = rgba(deep, a);
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(x, y+dy*14); ctx.lineTo(x, y); ctx.lineTo(x+dx*14, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + dx*5, y + dy*5, 3.2, 0, Math.PI*2);
    ctx.stroke();
  }

  function dashLine(x0,y0,x1,y1, a, dash){
    ctx.save();
    ctx.strokeStyle = rgba(line, a);
    ctx.lineWidth = 0.7;
    ctx.setLineDash(dash || [3, 3.5]);
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    ctx.restore();
  }

  function solidLine(x0,y0,x1,y1, a, w){
    ctx.strokeStyle = rgba(deep, a);
    ctx.lineWidth = w||0.8;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  }

  function drawLabel(text, x, y, a, align){
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = deep;
    ctx.font = `${Math.max(9, 10*S/1.1)}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function grownBlade(spec, grow, lean, origin, up){
    const isLeaf = spec.kind==='leaf';
    const lenK = isLeaf ? lerp(0.16,1,grow) : lerp(0.48,1,grow);
    const widK = isLeaf ? lerp(0.10,1,Math.pow(grow,0.75)) : lerp(0.40,1,grow);
    return Object.assign({}, spec, { len: spec.len*lenK, wid: spec.wid*widK });
  }
  function bladeSamples(spec, grow, lean, origin, up){
    const grown = grownBlade(spec, grow, lean, origin, up);
    const root = project(origin);
    const tip = project(bladePoint(1,0,grown,lean,origin,up));
    const L = project(bladePoint(0.52,-1,grown,lean,origin,up));
    const R = project(bladePoint(0.52, 1,grown,lean,origin,up));
    const outline = [];
    const us = [0.08,0.22,0.38,0.52,0.68,0.82,0.94,1];
    for (let i=0;i<us.length;i++){
      outline.push(project(bladePoint(us[i],-1,grown,lean,origin,up)));
      outline.push(project(bladePoint(us[i], 1,grown,lean,origin,up)));
    }
    return { root, tip, L, R, outline, grown };
  }
  function obbFromBlade(samp, pad){
    pad = pad==null ? 7 : pad;
    const dx = samp.tip.x-samp.root.x, dy = samp.tip.y-samp.root.y;
    const L = Math.hypot(dx,dy)||1;
    const ux = dx/L, uy = dy/L;
    const vx = -uy, vy = ux;
    let minU=0, maxU=0, minV=0, maxV=0;
    const pts = [samp.root, samp.tip, samp.L, samp.R].concat(samp.outline);
    for (let i=0;i<pts.length;i++){
      const p=pts[i];
      const u=(p.x-samp.root.x)*ux+(p.y-samp.root.y)*uy;
      const v=(p.x-samp.root.x)*vx+(p.y-samp.root.y)*vy;
      if (u<minU) minU=u; if (u>maxU) maxU=u;
      if (v<minV) minV=v; if (v>maxV) maxV=v;
    }
    minU-=pad; maxU+=pad; minV-=pad; maxV+=pad;
    const corner=(u,v)=>({x:samp.root.x+u*ux+v*vx, y:samp.root.y+u*uy+v*vy});
    return {
      c:[corner(minU,minV), corner(maxU,minV), corner(maxU,maxV), corner(minU,maxV)],
      tip:samp.tip, root:samp.root, L:samp.L, R:samp.R,
      far: corner(maxU, (minV+maxV)/2)
    };
  }
  function drawObb(obb, a, label){
    if (!obb || a<=0.02) return;
    ctx.save();
    ctx.strokeStyle = rgba(aqua, a);
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(obb.c[0].x, obb.c[0].y);
    for (let i=1;i<4;i++) ctx.lineTo(obb.c[i].x, obb.c[i].y);
    ctx.closePath();
    ctx.stroke();
    const hs=2.2;
    for (let i=0;i<4;i++){
      const p=obb.c[i];
      ctx.fillStyle = rgba(deep, a*1.45);
      ctx.fillRect(p.x-hs,p.y-hs,hs*2,hs*2);
    }
    ctx.strokeStyle = rgba(deep, a*0.95);
    ctx.lineWidth = 0.7;
    ctx.strokeRect(obb.tip.x-2.3, obb.tip.y-2.3, 4.6, 4.6);
    if (label && a>0.14){
      drawLabel(label, obb.far.x+6, obb.far.y, a*0.95, 'left');
    }
    ctx.restore();
  }
  function scaleObb(obb, k, origin){
    const o = origin || obb.root;
    const p = (q)=>({ x: o.x+(q.x-o.x)*k, y: o.y+(q.y-o.y)*k });
    return { c: obb.c.map(p), tip:p(obb.tip), root:o, L:p(obb.L), R:p(obb.R), far:p(obb.far) };
  }
  function leafTip(t, i){
    const spec = LEAVES[i];
    const g = Math.max(0.08, leafGrow(t, i));
    const samp = bladeSamples(spec, g, lerp(8*D, spec.openLean, g), stemPoint(spec.node), stemTan(spec.node));
    return samp.tip;
  }
  function plotterAt(t){
    /* sit on the construction being written: first the spreading frame, then the growth inside it */
    if (t < T.stemFrame0) return project(stemPoint(0));
    if (t < T.stem0) return project(stemPoint(smoother(gate(t, T.stemFrame0, T.stemFrame1))));
    if (t < T.stem1) return project(stemPoint(smoother(gate(t, T.stem0, T.stem1))));
    for (let i=0;i<LEAF_T.length;i++){
      const L = LEAF_T[i];
      if (t < L.grow1 + 0.15){
        const spec = LEAVES[i];
        if (t < L.grow0){
          const k = Math.max(0.08, leafFrame(t,i).spread);
          const samp = bladeSamples(spec, 1, spec.openLean, stemPoint(spec.node), stemTan(spec.node));
          const obb = scaleObb(obbFromBlade(samp, 6), k, samp.root);
          return obb.tip;
        }
        return leafTip(t, i);
      }
    }
    let best=null, bestScore=-1;
    for (let i=0;i<PETALS.length;i++){
      const spec=PETALS[i];
      const ph=petalPhase(t, i);
      if (ph.frameA<=0.02 && ph.open<=0) continue;
      const mid = ph.open<=0 ? ph.frameSpread : (1-Math.abs(ph.open-0.55));
      if (mid>bestScore){ bestScore=mid; best={spec, ph}; }
    }
    if (!best) return project(stemPoint(1));
    const {spec, ph} = best;
    if (ph.open<=0.02){
      const samp = bladeSamples(spec, 1, spec.openLean, stemPoint(1), stemTan(1));
      return scaleObb(obbFromBlade(samp, 5), Math.max(0.08, ph.frameSpread), samp.root).tip;
    }
    const lean = lerp(6*D, spec.openLean, ph.open);
    return bladeSamples(spec, Math.max(0.2, ph.bud), lean, stemPoint(1), stemTan(1)).tip;
  }

  function drawConstruction(t){
    const f = smoother(gate(t, T.frame0, T.frame1));
    if (f<=0) return;
    const b = artboard();
    const fa = 0.22 + 0.55*f;
    /* flicker the plate slightly, like a redraw */
    const blink = (RM||STILL) ? 1 : (hash(Math.floor(t*11)+3) < 0.08 ? 0.45 : 1);
    const a = fa * blink;

    /* crop / registration marks — a design frame, not a box */
    drawCropMark(b.x0, b.y0,  1,  1, a);
    drawCropMark(b.x1, b.y0, -1,  1, a);
    drawCropMark(b.x0, b.y1,  1, -1, a);
    drawCropMark(b.x1, b.y1, -1, -1, a);

    /* edge rulers */
    const ticks = 12;
    for (let i=0;i<=ticks;i++){
      const u=i/ticks;
      const x = lerp(b.x0, b.x1, u);
      const y = lerp(b.y1, b.y0, u);
      const big = i%3===0;
      solidLine(x, b.y1, x, b.y1+(big?8:4), a*(big?0.85:0.4), 0.6);
      solidLine(b.x0, y, b.x0-(big?8:4), y, a*(big?0.85:0.4), 0.6);
    }
    if (f>0.6){
      drawLabel('00', b.x0-22, b.y1+20, a*0.7, 'center');
      drawLabel('01', b.x1+22, b.y1+20, a*0.7, 'center');
      drawLabel('10', b.x0-22, b.y0-18, a*0.7, 'center');
      drawLabel('11', b.x1+22, b.y0-18, a*0.7, 'center');
    }

    /* vertical construction axis */
    const stemU = (t < T.stemFrame0) ? 0 : (t < T.stem0 ? smoother(gate(t, T.stemFrame0, T.stemFrame1)) : 1);
    if (stemU>0){
      const p0 = project(stemPoint(0));
      const p1 = project(stemPoint(stemU));
      /* draw the spline as a construction stroke */
      ctx.save();
      const guideA = (0.35 + 0.65*(1 - smoother(gate(t, T.stem1, T.stem1+2.0)))) * blink;
      ctx.strokeStyle = rgba(deep, 0.28*guideA);
      ctx.lineWidth = 0.8;
      ctx.setLineDash([2.5, 2.5]);
      ctx.beginPath();
      const n = Math.max(4, Math.round(40*stemU));
      for (let i=0;i<=n;i++){
        const q = project(stemPoint((i/n)*stemU));
        if (i===0) ctx.moveTo(q.x,q.y); else ctx.lineTo(q.x,q.y);
      }
      ctx.stroke();
      ctx.restore();
      /* control points, like a bezier being edited */
      const handleA = (1 - smoother(gate(t, T.stem1+0.2, T.stem1+1.6))) * blink;
      const cps = [STEM.p0, STEM.p1, STEM.p2, STEM.p3].map(project);
      const shown = 1 + Math.floor(stemU*3);
      if (handleA>0.03){
        for (let i=0;i<shown && i<cps.length;i++){
          const q=cps[i];
          ctx.strokeStyle = rgba(line, 0.55*handleA);
          ctx.lineWidth = 0.7;
          ctx.strokeRect(q.x-3, q.y-3, 6, 6);
          if (i>0) dashLine(cps[i-1].x,cps[i-1].y,q.x,q.y, 0.25*handleA, [2,3]);
        }
      }
      /* height dimension: live while the stem is written, then put away */
      const dimA = (1 - smoother(gate(t, T.stem1+0.12, T.stem1+0.85))) * blink;
      if (dimA > 0.03){
        const dimX = b.x1 - 22;
        const top = project(stemPoint(stemU));
        const bot = project(stemPoint(0));
        dashLine(top.x+8, top.y, dimX, top.y, 0.3*dimA, [2,3]);
        dashLine(bot.x+8, bot.y, dimX, bot.y, 0.3*dimA, [2,3]);
        solidLine(dimX, top.y, dimX, bot.y, 0.45*dimA, 0.7);
        solidLine(dimX-4, top.y, dimX+4, top.y, 0.45*dimA, 0.7);
        solidLine(dimX-4, bot.y, dimX+4, bot.y, 0.45*dimA, 0.7);
        const hh = Math.round(stemU*412);
        drawLabel(String(hh).padStart(3,'0'), dimX+10, (top.y+bot.y)/2, 0.55*dimA, 'left');
      }
      /* bezier handles fade once the stem is committed */
      /* (control squares already drawn above; fade them with dimA after stem) */
    }

    /* each leaf: empty frame spreads to its final size first, then the leaf grows inside it */
    const leafLabel = ['01','10'];
    LEAVES.forEach((spec,i)=>{
      const fr = leafFrame(t,i);
      if (fr.alpha<=0.03) return;
      const origin = stemPoint(spec.node);
      const up = stemTan(spec.node);
      const samp = bladeSamples(spec, 1, spec.openLean, origin, up);
      const k = Math.max(0.06, fr.spread);
      const obb = scaleObb(obbFromBlade(samp, 6), k, samp.root);
      dashLine(obb.root.x,obb.root.y,obb.tip.x,obb.tip.y, 0.4*fr.alpha*blink, [2,3]);
      dashLine(obb.L.x,obb.L.y,obb.R.x,obb.R.y, 0.28*fr.alpha*blink, [2,3]);
      drawObb(obb, 0.52*fr.alpha*blink, leafLabel[i]);
    });

    /* bud: a shared construction at the receptacle, not a shot of the whole flower */
    const bud = smoother(gate(t, T.bud0-0.25, T.bud1));
    const receptacleA = (1 - smoother(gate(t, T.open0, T.open0+1.6))) * blink;
    if (bud>0 && receptacleA>0.03){
      const o = project(stemPoint(1));
      const rad = lerp(14, 36, bud) * S * 0.9;
      ctx.save();
      ctx.strokeStyle = rgba(line, 0.32*receptacleA);
      ctx.lineWidth = 0.7;
      ctx.setLineDash([2.5, 3]);
      ctx.beginPath(); ctx.arc(o.x, o.y, rad, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(o.x, o.y, rad*0.55, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    /* each petal: empty frame spreads to the final open size, then the petal unfurls into it */
    PETALS.forEach((spec, i)=>{
      const ph = petalPhase(t, i);
      if (ph.frameA<=0.03) return;
      const samp = bladeSamples(spec, 1, spec.openLean, stemPoint(1), stemTan(1));
      const k = Math.max(0.06, ph.frameSpread);
      const obb = scaleObb(obbFromBlade(samp, 5), k, samp.root);
      const o = project(stemPoint(1));
      dashLine(o.x, o.y, obb.tip.x, obb.tip.y, 0.28*ph.frameA*blink, [2,3]);
      dashLine(obb.L.x,obb.L.y,obb.R.x,obb.R.y, 0.22*ph.frameA*blink, [2,3]);
      drawObb(obb, 0.48*ph.frameA*blink, null);
    });

    /* a small CAD snap at the writing tip — not a viewfinder */
    const pen = plotterAt(t);
    const penFade = 1 - smoother(gate(t, T.open1, T.open1+1.1));
    if (f>0.4 && penFade>0.04){
      const pa = ((RM||STILL)?0.55:(hash(Math.floor(t*18)+9)<0.35?0.12:0.7)) * penFade;
      ctx.strokeStyle = rgba(deep, pa);
      ctx.lineWidth = 0.8;
      const r=4.5;
      ctx.beginPath(); ctx.moveTo(pen.x-r,pen.y); ctx.lineTo(pen.x+r,pen.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pen.x,pen.y-r); ctx.lineTo(pen.x,pen.y+r); ctx.stroke();
    }
  }

  function drawParticles(t){
    /* back to front */
    const drawn = [];
    for (let i=0;i<parts.length;i++){
      const pt = parts[i];
      if (t < pt.born) continue;
      const w = worldOf(pt, t);
      if (!w) continue;
      const q = project(w);
      const j = jitter(pt, t);
      q.x += j.x; q.y += j.y;
      const fl = flick(pt, t);
      if (fl<=0.02) continue;
      drawn.push({ pt, q, fl });
    }
    drawn.sort((a,b)=> a.q.z-b.q.z);

    ctx.save();
    ctx.font = `${Math.max(7, 9*S/1.15)}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i=0;i<drawn.length;i++){
      const { pt, q, fl } = drawn[i];
      const a = fl * (pt.kind==='dust' ? 0.45 : 0.85);
      if (pt.glyph){
        ctx.fillStyle = rgba(pt.col, a);
        ctx.fillText(pt.glyph, q.x, q.y);
      } else {
        const s = pt.size * (S/1.05);
        ctx.fillStyle = rgba(pt.col, a);
        ctx.fillRect(q.x-s*0.5, q.y-s*0.5, s, s);
      }
    }
    ctx.restore();
  }

  function clock(now, t0){
    if (AT != null) return AT;
    if (RM) return 25;
    if (STILL) return AT != null ? AT : 24.4;
    return (now - t0) / 1000;
  }

  function render(t){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle = pale;
    ctx.fillRect(0,0,W,H);

    drawConstruction(t);
    drawParticles(t);

    /* a very quiet running tick, like a plot log */
    if (t > 0.2){
      const blink = (RM||STILL)?1:(hash(Math.floor(t*8)+1)<0.2?0.2:0.7);
      const code = (Math.floor(t*23)%2===0)?'0':'1';
      drawLabel(`GEN  ${code}${code}${(Math.floor(t*10)%2)}`, 24, H-24, 0.35*blink, 'left');
    }
  }

  let t0 = performance.now();
  function frame(now){
    render(clock(now, t0));
    if (!STILL && !RM && AT==null) requestAnimationFrame(frame);
  }

  addEventListener('resize', () => { fit(); render(clock(performance.now(), t0)); });
  addEventListener('click', () => {
    if (STILL || RM || AT!=null) return;
    t0 = performance.now();
  });

  seed();
  fit();
  if (STILL || RM || AT!=null) render(clock(performance.now(), t0));
  else requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
