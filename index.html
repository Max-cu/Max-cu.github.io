<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<style>
/* Ice-blue void, grain and vignette over a fixed WebGL scene. */
:root{
  --aqua:#7fd9e4;
  --pale:#e9fbfc;
  --line:#4fb9c9;
  --deep:#0b3a4e;
  --panel:#bfeef2;
}
html,body{margin:0;background:#fff;color:var(--deep)}
html{scrollbar-width:none}
body{overflow-x:hidden;min-height:100%}
body::-webkit-scrollbar{display:none}
#gl{
  position:fixed;inset:0;width:100%;height:100%;
  display:block;z-index:0;pointer-events:none;
}
#vig{
  position:fixed;inset:0;z-index:30;pointer-events:none;
  background:radial-gradient(ellipse at 48% 40%, transparent 64%, rgba(10,40,64,.08) 100%);
}
#grade{
  position:fixed;left:-140px;top:-140px;width:calc(100vw + 280px);height:calc(100vh + 280px);
  z-index:31;pointer-events:none;will-change:transform;
  animation:grain .48s steps(1) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)}
  25%{transform:translate(61px,-36px)}
  50%{transform:translate(-43px,72px)}
  75%{transform:translate(29px,48px)}
}
@media (prefers-reduced-motion:reduce){#grade{animation:none}}

#page{position:relative;z-index:1;height:480vh}


/* Left-column typography. Windows are opaque ice-blue paper, not glass. */
:root{
  --mute:#3f7486;
  --disp:"Iowan Old Style",Palatino,"Palatino Linotype","EB Garamond","Noto Serif Display","Noto Serif CJK SC",Georgia,serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC","Noto Sans",system-ui,sans-serif;
  --px:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,"Noto Sans Mono CJK SC",Consolas,monospace;
}
#home{
  position:fixed;left:0;top:0;bottom:0;
  width:min(40vw,500px);
  z-index:20;pointer-events:none;
  box-sizing:border-box;
}
#nm, #home .beat{
  position:absolute;
  left:max(32px, 3.8vw);
  width:min(332px, calc(100% - 52px));
  will-change:opacity,transform;
}
#nm{
  top:50%;
  margin:0;
  color:var(--deep);
  font-family:var(--disp);
  font-weight:400;
  font-size:clamp(64px, 8.2vw, 100px);
  font-synthesis:none;
  line-height:.88;
  letter-spacing:-.038em;
  transform-origin:left center;
  opacity:var(--v,1);
  transform:translate3d(0, calc(-50% + var(--dy, 0px)), 0) scale(var(--sc, 1));
}
#home .beat{
  top:36%;
  width:max-content;
  max-width:min(300px, calc(100% - 52px));
  opacity:var(--v,0);
  transform:translate3d(0, calc(-50% + (1 - var(--v, 0)) * 18px), 0);
}
.win{
  background:var(--pale);
  border:2px solid var(--aqua);
  outline:1px solid var(--line);
  box-shadow:7px 7px 0 rgba(11,58,78,.2);
  display:flex;flex-direction:column;
  min-width:0;
}
.bar{
  display:flex;align-items:center;
  box-sizing:border-box;
  min-height:26px;
  padding:4px 10px;
  background:var(--aqua);
  color:var(--deep);
  font:400 12px/1 var(--px);
  letter-spacing:.06em;
  text-transform:uppercase;
  -webkit-font-smoothing:none;
  font-variant-ligatures:none;
  user-select:none;
}
.bar h2{margin:0;font:inherit;color:inherit;white-space:nowrap}
.win .body{padding:14px 16px 16px;color:var(--deep)}
#edu.beat{max-width:min(400px, calc(100% - 52px))}
#edu .body{display:flex;flex-direction:column;gap:12px}
#edu .row{margin:0;display:flex;flex-direction:row;align-items:center;gap:10px}
#edu .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
#edu .sch-mark{
  display:block;flex:0 0 60px;width:60px;height:60px;
}
#edu .sch{
  font:400 15px/1.3 var(--sans);
  color:var(--deep);
}
#edu .deg{
  font:400 12px/1 var(--px);
  color:var(--mute);
  letter-spacing:.04em;
  -webkit-font-smoothing:none;
}
#edu .maj{
  margin:2px 0 0;
  padding-top:10px;
  border-top:1px solid var(--panel);
  font:400 14px/1.3 var(--sans);
  color:var(--deep);
}
#job.beat{max-width:min(380px, calc(100% - 52px))}
#job .body p{
  margin:0;
  font:400 16px/1.55 var(--sans);
  color:var(--deep);
}
#caps{
  display:flex;flex-direction:column;align-items:stretch;gap:8px;
}
#caps .bar{width:auto;}
#caps ul{
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  margin:0;padding:0;list-style:none;
}
#caps li{
  background:var(--pale);
  border:2px solid var(--aqua);
  outline:1px solid var(--line);
  box-shadow:5px 5px 0 rgba(11,58,78,.18);
  padding:8px 12px 7px;
  color:var(--deep);
  font:400 13px/1 var(--px);
  letter-spacing:.02em;
  -webkit-font-smoothing:none;
  font-variant-ligatures:none;
}
#caps li:nth-child(2){margin-left:10px}
#caps li:nth-child(3){margin-left:4px}
#feat{
  display:flex;flex-direction:column;align-items:flex-start;gap:12px;
}
#feat .sg-body{
  display:flex;align-items:center;gap:7px;
  padding:14px 16px 16px;
}
#feat .sg-row{
  display:flex;align-items:center;gap:7px;
}
#feat .sg-mark{display:block;flex:0 0 88px;width:88px;height:88px}
#feat .sg-name{
  margin:0;
  color:var(--deep);
  font-family:var(--disp);
  font-weight:400;
  font-size:28px;
  line-height:1;
  letter-spacing:-.03em;
}
#feat .sg-gh{
  pointer-events:auto;
  color:var(--deep);
  display:inline-flex;align-items:center;
  line-height:0;
  text-decoration:none;
  margin-left:16px;
}
#feat .sg-gh svg{display:block;width:24px;height:24px}
#feat .sg-gh:hover{color:#0b3a4e;opacity:.78}
@media (prefers-reduced-motion:reduce){
  #nm,#home .beat{will-change:auto}
}
@media (max-aspect-ratio:1/1){
  #home{width:min(72vw, 380px)}
  #nm, #home .beat{left:max(20px, 4vw);width:min(300px, calc(100% - 36px))}
  #nm{top:22%;font-size:clamp(52px, 14vw, 80px)}
  #home .beat{top:32%}
  #edu.beat{max-width:min(320px, calc(100% - 36px))}
  #job.beat{max-width:min(320px, calc(100% - 36px))}
  #edu .sch-mark{flex-basis:52px;width:52px;height:52px}
  #feat .sg-mark{flex-basis:72px;width:72px;height:72px}
  #feat .sg-name{font-size:24px}
}
</style>
</head>

    box(x, y + 4.15, z, 0.46, 0.36, 0.46, 'red');
    const y0 = y + 2.85, y1 = y + 4.05, len = 2.5, n = 5;
    for (let i = 0; i < n; i++) {
      const t0 = i / n, t1 = (i + 1) / n;
      const xa = x + len * t0, xb = x + len * t1;
      const col = i % 2 ? PAL.red[1] : PAL.red[2];
      const s0 = 0.15 + t0 * 0.7, s1 = 0.15 + t1 * 0.7;
      const a = [xa, y0, z], b = [xb, y0, z], c = [xb, y1, z], d = [xa, y1, z];
      push(a, col, s0, 0); push(b, col, s1, 0); push(c, col, s1, 0);
      push(a, col, s0, 0); push(c, col, s1, 0); push(d, col, s0, 0);
      const bk = [col[0] * 0.78, col[1] * 0.78, col[2] * 0.78];
      push(a, bk, s0, 0); push(d, bk, s0, 0); push(c, bk, s1, 0);
      push(a, bk, s0, 0); push(c, bk, s1, 0); push(b, bk, s1, 0);
    }
  }

  function stack(x, z, h, r, mat) {

    mat = mat || 'ink';

    loftY(x, z, [

  function elevRails(cx, cz, y0, y1, half) {

  route([[30, 2.05, 10.2], [67.8, 2.05, 10.2]], 0.62, 'pipe', { sides: 10 });

  /* B overhead vapor → elevated condenser (distillation silhouette) */

    route([

      [60.3, 1.9, 9.7],
    ], 0.32, 'pipe', { sides: 8, bend: 0.95 });

  ], 0.58, 'pipe', { sides: 10, bend: 1.2 });
  /* south-side sleepers under that run — not a second rack. North leg would sit in the drums. */
  {
    const yBeam = 21.72;
    for (const x of [54.0, 57.6, 60.8]) {

  /* D overhead: vapor into the condenser, condensate to its own drum, reflux just below the head */
  {

  route([
    [40.05, 1.55, 8.4],

    const vName = Math.max(hero, sign * 0.9);
    nameEl.style.setProperty('--v', vName.toFixed(4));
    const k = sign / (sign + hero + 1e-6);
    nameEl.style.setProperty('--sc', (1 - 0.74 * k).toFixed(4));
    /* Move the signature toward the upper left of the column. */
    nameEl.style.setProperty('--dy', ((-1) * (innerHeight * 0.38) * k).toFixed(2) + 'px');
    nameEl.style.visibility = vName > 0.02 ? 'visible' : 'hidden';
    setVis(beats.edu,  gate(u, 0.14, 0.22, 0.34, 0.42) * inn);
    setVis(beats.job,  gate(u, 0.40, 0.48, 0.58, 0.66) * inn);
    setVis(beats.caps, gate(u, 0.64, 0.72, 0.78, 0.86) * inn);
    setVis(beats.feat, gate(u, 0.82, 0.90, 1.05, 1.15) * inn);
  }

  syncHome(cur, intro);
  fit();
  draw(performance.now());
  const loop = now => { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);

  /* grain tile, same family as the reference page */
  {
    const N = 159, c = document.createElement('canvas');
    c.width = c.height = N;
    const x = c.getContext('2d'), img = x.createImageData(N, N), a = img.data;
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0, y = 0; y < N; y++) for (let e = 0; e < N; e++, i += 4) {
      const r = rnd();
      let v = [0, 0, 0, 0];
      if (r < 0.1) v = [10, 48, 72, 13 + rnd() * 18];
      else if (r < 0.18) v = [255, 255, 255, 28 + rnd() * 40];
      if (r > 0.2 && r < 0.206) v = [80, 210, 220, 64];
      if (y % 3 === 2 && v[3] < 8) v = [10, 50, 78, 8];
      a[i] = v[0]; a[i + 1] = v[1]; a[i + 2] = v[2]; a[i + 3] = v[3];
    }
    x.putImageData(img, 0, 0);
    const G = document.getElementById('grade');
    G.style.backgroundImage = `url(${c.toDataURL()})`;
    if ((devicePixelRatio || 1) >= 1.5) G.style.backgroundSize = `${N / 2}px ${N / 2}px`;
  }
  {
    const art = k => {
      const c = document.createElement('canvas');
      c.width = 15 * k; c.height = 21 * k;
      const x = c.getContext('2d');
      x.fillStyle = '#000';
      x.fillRect(5 * k, 0, 5 * k, 21 * k);
      x.fillRect(0, 4 * k, 15 * k, 5 * k);
      x.fillStyle = '#fff';
      x.fillRect(6 * k, k, 3 * k, 19 * k);
      x.fillRect(k, 5 * k, 13 * k, 3 * k);
      return `url(${c.toDataURL()})`;
    };
    const one = art(1);
    const set = `image-set(${one} 1x, ${art(2)} 2x) 7 6, move`;
    const root = document.documentElement;
    root.style.setProperty('--xcur', CSS.supports('cursor', set) ? set : one + ' 7 6, move');
    const df = set.replace(', move', ', default');
    root.style.setProperty('--xdef', CSS.supports('cursor', df) ? df : one + ' 7 6, default');
  }


})();
</script>
</body>
