<!DOCTYPE html>
<html lang="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<style>
/* Ice-blue void, grain and vignette over a fixed WebGL scene. */
:root{
  --aqua:#7fd9e4;
  --pale:#e9fbfc;
  --line:#4fb9c9;
  --deep:#0b3a4e;
  --panel:#bfeef2;
}
html,body{margin:0;background:#fff;color:var(--deep)}
html{scrollbar-width:none}
body{overflow-x:hidden;min-height:100%}
body::-webkit-scrollbar{display:none}
#gl{
  position:fixed;inset:0;width:100%;height:100%;
  display:block;z-index:0;pointer-events:none;
}
#vig{
  position:fixed;inset:0;z-index:30;pointer-events:none;
  background:radial-gradient(ellipse at 48% 40%, transparent 64%, rgba(10,40,64,.08) 100%);
}
#grade{
  position:fixed;left:-140px;top:-140px;width:calc(100vw + 280px);height:calc(100vh + 280px);
  z-index:31;pointer-events:none;will-change:transform;
  animation:grain .48s steps(1) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)}
  25%{transform:translate(61px,-36px)}
  50%{transform:translate(-43px,72px)}
  75%{transform:translate(29px,48px)}
}
@media (prefers-reduced-motion:reduce){#grade{animation:none}}

#page{position:relative;z-index:1;height:480vh}

</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="grade"></div>
<main id="page"></main>
<script>
/* Faceted ice-blue chemical plant. One static buffer, tones baked from a fixed light. */
(() => {
  const TAU = Math.PI * 2;
  const qs = new URLSearchParams(location.search);
  const STILL = qs.has('still');
  const AT = qs.has('at') ? Math.min(1, Math.max(0, parseFloat(qs.get('at')) || 0)) : null;
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
  const PAL = {
    paper: ['#e7f6fc', '#6ec4e6', '#145a86'].map(hex),
    shade: ['#b7dff0', '#3c94c4', '#0c3e68'].map(hex),
    ink:   ['#c5e4f4', '#2f86b6', '#0a3356'].map(hex),
    dish:  ['#f4fbfd', '#c9e9f6', '#7ec0dc'].map(hex),
    night: ['#123044', '#0b2434', '#061820'].map(hex),
    pipe:  ['#d4f0f8', '#54b0d6', '#10486e'].map(hex),
    deck:  ['#a9d4e6', '#348aaf', '#0a3854'].map(hex),
    band:  ['#f3fbfd', '#9ad4ea', '#4ea4c8'].map(hex),
    ring:  ['#f7fdfe', '#d7eef6', '#b7dcea'].map(hex),
    glow:  ['#e7fbff', '#d6f6ff', '#c8f3ff'].map(hex),
    red:   ['#ff4d68', '#e01e40', '#8e1630'].map(hex),
  };
  const LIGHT = norm([-0.62, 0.72, 0.32]);
  const NCOL = [1, 1, 1];

  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function norm(a) {
    const l = Math.hypot(a[0], a[1], a[2]);
    if (l < 1e-8) return [0, 1, 0];
    return [a[0] / l, a[1] / l, a[2] / l];
  }
  function perp(t) {
    const a = Math.abs(t[1]) > 0.85 ? [1, 0, 0] : [0, 1, 0];
    return norm(cross(t, a));
  }
  function rot(v, axis, ang) {
    const k = norm(axis), c = Math.cos(ang), s = Math.sin(ang);
    const cr = cross(k, v), d = dot(k, v);
    return [
      v[0] * c + cr[0] * s + k[0] * d * (1 - c),
      v[1] * c + cr[1] * s + k[1] * d * (1 - c),
      v[2] * c + cr[2] * s + k[2] * d * (1 - c),
    ];
  }
  const aoAt = y => 0.92 + 0.08 * clamp(y / 18, 0, 1);

  function shade(n, mat, ao) {
    if (mat === 'glow') return PAL.glow[0];
    const d = dot(n, LIGHT);
    const p = PAL[mat] || PAL.paper;
    const c = d > 0.58 ? p[0] : d > 0.04 ? p[1] : p[2];
    const up = n[1] * 0.5 + 0.5;
    const k = (ao == null ? 1 : ao) * (0.96 + 0.04 * up);
    return [c[0] * k, c[1] * k, c[2] * k];
  }

  const V = [];
  let dropped = 0;
  function push(p, c, sw, g) {
    V.push(p[0], p[1], p[2], c[0], c[1], c[2], sw || 0, g || 0);
  }
  function finite(p) { return p && isFinite(p[0]) && isFinite(p[1]) && isFinite(p[2]); }
  function tri(a, b, c, mat, interior, ao) {
    if (V.length > 2800000) { dropped++; return; }
    if (!finite(a) || !finite(b) || !finite(c)) return;
    const cr = cross(sub(b, a), sub(c, a));
    const area = Math.hypot(cr[0], cr[1], cr[2]);
    if (area < 1e-7) return;
    let n = mul(cr, 1 / area);
    if (interior && dot(n, sub(a, interior)) < 0) n = mul(n, -1);
    const col = shade(n, mat, ao);
    const g = mat === 'glow' ? 1 : 0;
    push(a, col, 0, g); push(b, col, 0, g); push(c, col, 0, g);
  }
  function quad(a, b, c, d, mat, interior, ao) {
    tri(a, b, c, mat, interior, ao);
    tri(a, c, d, mat, interior, ao);
  }
  function hull(c, mat, ao) {
    const o = mul(c.reduce(add, [0, 0, 0]), 1 / 8);
    quad(c[0], c[1], c[2], c[3], mat, o, ao);
    quad(c[4], c[5], c[6], c[7], mat, o, ao);
    for (let i = 0; i < 4; i++) {
      const j = (i + 1) % 4;
      quad(c[i], c[j], c[j + 4], c[i + 4], mat, o, ao);
    }
  }
  function box(x, y, z, w, h, d, mat, ry, ao) {
    ry = ry || 0;
    const cs = Math.cos(ry), sn = Math.sin(ry);
    const P = (a, b, e) => [x + a * w / 2 * cs + e * d / 2 * sn, y + b * h / 2, z - a * w / 2 * sn + e * d / 2 * cs];
    hull([
      P(-1, -1, -1), P(1, -1, -1), P(1, -1, 1), P(-1, -1, 1),
      P(-1, 1, -1), P(1, 1, -1), P(1, 1, 1), P(-1, 1, 1),
    ], mat, ao == null ? aoAt(y) : ao);
  }
  function beam(a, b, t, mat, ao) {
    const d = sub(b, a);
    const L = Math.hypot(d[0], d[1], d[2]);
    if (L < 0.05 || !(t > 0)) return;
    const ax = mul(d, 1 / L);
    const u = perp(ax);
    const v = cross(ax, u);
    const s = t / 2;
    const ring = o => [
      add(o, add(mul(u, -s), mul(v, -s))),
      add(o, add(mul(u, s), mul(v, -s))),
      add(o, add(mul(u, s), mul(v, s))),
      add(o, add(mul(u, -s), mul(v, s))),
    ];
    hull(ring(a).concat(ring(b)), mat, ao == null ? aoAt((a[1] + b[1]) / 2) : ao);
  }

  function loftAxis(fixed, rings, n, mat, axis) {
    /* rings: {t, ra, rb}. axis 'y' grows up; 'x' grows along x. ra/rb are the two radii. */
    const P = (k, i) => {
      const r = rings[k], a = (i / n) * TAU;
      const ca = Math.cos(a) * r.ra, sa = Math.sin(a) * r.rb;
      if (axis === 'x') return [r.t, fixed[0] + ca, fixed[1] + sa];
      return [fixed[0] + ca, r.t, fixed[1] + sa];
    };
    for (let k = 0; k < rings.length - 1; k++) {
      const y = axis === 'x' ? fixed[0] : (rings[k].t + rings[k + 1].t) / 2;
      const ao = aoAt(axis === 'x' ? fixed[0] : y);
      const midT = (rings[k].t + rings[k + 1].t) / 2;
      const ctr = axis === 'x' ? [midT, fixed[0], fixed[1]] : [fixed[0], midT, fixed[1]];
      for (let i = 0; i < n; i++) quad(P(k, i), P(k, i + 1), P(k + 1, i + 1), P(k + 1, i), mat, ctr, ao);
    }
  }
  const loftY = (x, z, rings, n, mat) => loftAxis([x, z], rings, n, mat, 'y');
  const loftX = (y, z, rings, n, mat) => loftAxis([y, z], rings, n, mat, 'x');

  function annulus(cx, y, cz, r0, r1, thick, mat, sides, ao) {
    const y0 = y, y1 = y + thick;
    const aoV = ao == null ? aoAt(y + thick * 0.5) : ao;
    sides = sides || 18;
    for (let i = 0; i < sides; i++) {
      const a0 = (i / sides) * TAU, a1 = ((i + 1) / sides) * TAU;
      const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
      const o0x = cx + c0 * r1, o0z = cz + s0 * r1, o1x = cx + c1 * r1, o1z = cz + s1 * r1;
      const i0x = cx + c0 * r0, i0z = cz + s0 * r0, i1x = cx + c1 * r0, i1z = cz + s1 * r0;
      const mid = [cx, (y0 + y1) / 2, cz];
      quad([i0x, y1, i0z], [o0x, y1, o0z], [o1x, y1, o1z], [i1x, y1, i1z], mat, [cx, y0 - 1, cz], aoV);
      quad([o0x, y0, o0z], [i0x, y0, i0z], [i1x, y0, i1z], [o1x, y0, o1z], mat, [cx, y1 + 1, cz], aoV);
      quad([o0x, y0, o0z], [o1x, y0, o1z], [o1x, y1, o1z], [o0x, y1, o0z], mat, mid, aoV);
      const mx = cx + c0 * (r0 + r1) * 0.5, mz = cz + s0 * (r0 + r1) * 0.5;
      quad([i0x, y1, i0z], [i1x, y1, i1z], [i1x, y0, i1z], [i0x, y0, i0z], mat, [mx, (y0 + y1) / 2, mz], aoV);
    }
  }
  function disc(c, normal, radius, mat, sides, ao) {
    const n = norm(normal), u = perp(n), v = cross(n, u);
    const interior = sub(c, mul(n, Math.max(radius, 0.4)));
    for (let i = 0; i < sides; i++) {
      const a0 = (i / sides) * TAU, a1 = ((i + 1) / sides) * TAU;
      const p0 = add(c, add(mul(u, Math.cos(a0) * radius), mul(v, Math.sin(a0) * radius)));
      const p1 = add(c, add(mul(u, Math.cos(a1) * radius), mul(v, Math.sin(a1) * radius)));
      tri(c, p0, p1, mat, interior, ao);
    }
  }
  function sphere(c, r, mat, seg, rings) {
    seg = seg || 16; rings = rings || 10;
    const pt = (rr, yy, a) => [c[0] + Math.cos(a) * rr, yy, c[2] + Math.sin(a) * rr];
    for (let j = 0; j < rings; j++) {
      const t0 = -Math.PI / 2 + Math.PI * j / rings;
      const t1 = -Math.PI / 2 + Math.PI * (j + 1) / rings;
      const y0 = c[1] + Math.sin(t0) * r, y1 = c[1] + Math.sin(t1) * r;
      const r0 = Math.cos(t0) * r, r1 = Math.cos(t1) * r;
      const ao = aoAt((y0 + y1) / 2);
      for (let i = 0; i < seg; i++) {
        const a0 = (i / seg) * TAU, a1 = ((i + 1) / seg) * TAU;
        if (Math.abs(r0) < 1e-3) tri([c[0], y0, c[2]], pt(r1, y1, a1), pt(r1, y1, a0), mat, c, ao);
        else if (Math.abs(r1) < 1e-3) tri([c[0], y1, c[2]], pt(r0, y0, a0), pt(r0, y0, a1), mat, c, ao);
        else quad(pt(r0, y0, a0), pt(r0, y0, a1), pt(r1, y1, a1), pt(r1, y1, a0), mat, c, ao);
      }
    }
  }
  function torus(center, R, tube, mat, maj, min, axis) {
    maj = maj || 28; min = min || 8;
    const ax = norm(axis || [0, 1, 0]);
    const u = perp(ax), v = cross(ax, u);
    for (let i = 0; i < maj; i++) {
      const a0 = (i / maj) * TAU, a1 = ((i + 1) / maj) * TAU;
      const c0 = add(center, add(mul(u, Math.cos(a0) * R), mul(v, Math.sin(a0) * R)));
      const c1 = add(center, add(mul(u, Math.cos(a1) * R), mul(v, Math.sin(a1) * R)));
      const rad0 = norm(sub(c0, center)), rad1 = norm(sub(c1, center));
      const ctr = mul(add(c0, c1), 0.5);
      for (let j = 0; j < min; j++) {
        const b0 = (j / min) * TAU, b1 = ((j + 1) / min) * TAU;
        const q = (c, rad, b) => add(c, add(mul(rad, Math.cos(b) * tube), mul(ax, Math.sin(b) * tube)));
        quad(q(c0, rad0, b0), q(c1, rad1, b0), q(c1, rad1, b1), q(c0, rad0, b1), mat, ctr, aoAt(center[1]));
      }
    }
  }

  function clean(pts) {
    const o = [];
    for (const p of pts) if (!o.length || dist(p, o[o.length - 1]) > 1e-4) o.push(p);
    return o;
  }
  function filletPath(pts, rad, segs) {
    pts = clean(pts);
    if (pts.length < 3 || !(rad > 0)) return pts;
    const out = [pts[0]];
    for (let i = 1; i < pts.length - 1; i++) {
      const a = pts[i - 1], b = pts[i], c = pts[i + 1];
      const va = sub(a, b), vc = sub(c, b);
      const la = Math.hypot(va[0], va[1], va[2]), lc = Math.hypot(vc[0], vc[1], vc[2]);
      if (la < 1e-4 || lc < 1e-4) { out.push(b); continue; }
      const da = mul(va, 1 / la), dc = mul(vc, 1 / lc);
      const phi = Math.acos(clamp(dot(da, dc), -1, 1));
      if (phi < 0.12 || Math.PI - phi < 0.08) { out.push(b); continue; }
      const setback = Math.min(rad / Math.tan(phi / 2), la * 0.46, lc * 0.46);
      const rEff = setback * Math.tan(phi / 2);
      const p1 = add(b, mul(da, setback));
      const p2 = add(b, mul(dc, setback));
      const bis = norm(add(da, dc));
      const center = add(b, mul(bis, rEff / Math.sin(phi / 2)));
      const v1 = sub(p1, center), v2 = sub(p2, center);
      const axis = cross(v1, v2);
      if (Math.hypot(axis[0], axis[1], axis[2]) < 1e-6) { out.push(b); continue; }
      const ang = Math.acos(clamp(dot(norm(v1), norm(v2)), -1, 1));
      const nseg = Math.max(2, Math.round((segs || 5) * ang / (Math.PI / 2)));
      for (let s = 0; s <= nseg; s++) out.push(add(center, rot(v1, axis, ang * s / nseg)));
    }
    out.push(pts[pts.length - 1]);
    return clean(out);
  }
  function subdivide(pts, maxLen) {
    if (pts.length < 2) return pts;
    const o = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], L = dist(a, b);
      const n = Math.max(1, Math.ceil(L / maxLen));
      for (let k = 1; k <= n; k++) o.push(lerp(a, b, k / n));
    }
    return o;
  }
  function sweep(pts, r, mat, sides, opt) {
    pts = clean(pts);
    if (pts.length < 2 || !(r > 0)) return;
    const n = pts.length;
    const T = new Array(n);
    for (let i = 0; i < n; i++) {
      const i0 = Math.max(0, i - 1), i1 = Math.min(n - 1, i + 1);
      T[i] = norm(sub(pts[i1], pts[i0]));
    }
    T[0] = norm(sub(pts[1], pts[0]));
    T[n - 1] = norm(sub(pts[n - 1], pts[n - 2]));
    let Nrm = perp(T[0]);
    const frames = [];
    for (let i = 0; i < n; i++) {
      if (i > 0) {
        const axis = cross(T[i - 1], T[i]);
        const s = Math.hypot(axis[0], axis[1], axis[2]);
        const c = clamp(dot(T[i - 1], T[i]), -1, 1);
        if (s > 1e-5) Nrm = rot(Nrm, mul(axis, 1 / s), Math.atan2(s, c));
        Nrm = sub(Nrm, mul(T[i], dot(Nrm, T[i])));
        const ln = Math.hypot(Nrm[0], Nrm[1], Nrm[2]);
        Nrm = ln < 1e-5 ? perp(T[i]) : mul(Nrm, 1 / ln);
      }
      frames.push({ p: pts[i], t: T[i], n: Nrm, b: cross(T[i], Nrm) });
    }
    const ring = f => {
      const o = [];
      for (let i = 0; i < sides; i++) {
        const a = (i / sides) * TAU;
        o.push(add(f.p, add(mul(f.n, Math.cos(a) * r), mul(f.b, Math.sin(a) * r))));
      }
      return o;
    };
    let prev = ring(frames[0]);
    for (let i = 1; i < n; i++) {
      const cur = ring(frames[i]);
      const ao = aoAt((frames[i - 1].p[1] + frames[i].p[1]) / 2);
      for (let k = 0; k < sides; k++) {
        const k1 = (k + 1) % sides;
        quad(prev[k], cur[k], cur[k1], prev[k1], mat, frames[i].p, ao);
      }
      prev = cur;
    }
    const cap = (f, dir) => disc(f.p, mul(f.t, dir), r, mat, sides, aoAt(f.p[1]));
    if (opt.cap !== false) { cap(frames[0], -1); cap(frames[n - 1], 1); }
    if (opt.flange) {
      collar(frames[0], r * 1.42, 0.2, mat, sides);
      collar(frames[n - 1], r * 1.42, 0.2, mat, sides);
    }
  }
  function collar(frame, r, len, mat, sides) {
    const t = frame.t;
    const a = add(frame.p, mul(t, -len / 2));
    const b = add(frame.p, mul(t, len / 2));
    const ringAt = p => {
      const o = [];
      for (let i = 0; i < sides; i++) {
        const ang = (i / sides) * TAU;
        o.push(add(p, add(mul(frame.n, Math.cos(ang) * r), mul(frame.b, Math.sin(ang) * r))));
      }
      return o;
    };
    const r0 = ringAt(a), r1 = ringAt(b);
    const ao = aoAt(frame.p[1]);
    for (let k = 0; k < sides; k++) {
      const k1 = (k + 1) % sides;
      quad(r0[k], r1[k], r1[k1], r0[k1], mat, frame.p, ao);
    }
  }
  function route(pts, r, mat, opt) {
    opt = opt || {};
    const bend = opt.bend == null ? Math.max(0.5, r * 2.2) : opt.bend;
    let path = filletPath(pts, bend, opt.arc || 5);
    path = subdivide(clean(path), opt.step || 3.2);
    sweep(clean(path), r, mat, opt.sides || 10, opt);
  }

  function band(x, z, y, r, mat, sides) {
    annulus(x, y, z, r - 0.22, r * 1.085, 0.46, mat || 'band', sides || 18);
  }
  function platform(x, z, y, coreR, width) {
    const r0 = coreR + 0.05, r1 = coreR + width;
    annulus(x, y, z, r0, r1, 0.42, 'shade', 20);
    annulus(x, y + 0.42, z, r1 - 0.34, r1 + 0.08, 0.36, 'paper', 20);
    const posts = 12;
    for (let i = 0; i < posts; i++) {
      const a0 = (i / posts) * TAU + 0.15, a1 = ((i + 1) / posts) * TAU + 0.15;
      const p0 = [x + Math.cos(a0) * r1, z + Math.sin(a0) * r1];
      const p1 = [x + Math.cos(a1) * r1, z + Math.sin(a1) * r1];
      beam([p0[0], y + 0.5, p0[1]], [p0[0], y + 1.45, p0[1]], 0.26, 'ink');
      beam([p0[0], y + 1.38, p0[1]], [p1[0], y + 1.38, p1[1]], 0.24, 'ink');
      beam([p0[0], y + 0.92, p0[1]], [p1[0], y + 0.92, p1[1]], 0.16, 'shade');
    }
    box(x + r1, y + 1.15, z, 0.42, 0.42, 0.42, 'glow', 0, 1);
  }
  function ladder(x, z, y0, y1, ang, radius, cage) {
    const cx = x + Math.cos(ang) * radius, cz = z + Math.sin(ang) * radius;
    const tx = -Math.sin(ang), tz = Math.cos(ang), w = 0.82;
    const r0 = [cx - tx * w / 2, cz - tz * w / 2];
    const r1 = [cx + tx * w / 2, cz + tz * w / 2];
    beam([r0[0], y0, r0[1]], [r0[0], y1, r0[1]], 0.22, 'ink');
    beam([r1[0], y0, r1[1]], [r1[0], y1, r1[1]], 0.22, 'ink');
    for (let y = y0 + 0.48; y < y1 - 0.15; y += 0.64) beam([r0[0], y, r0[1]], [r1[0], y, r1[1]], 0.12, 'shade');
    if (!cage) return;

  gl_FragColor = vec4(mix(H, vec3(1.0), c), max(c, h) * A);
}`;
    const pr = link(mvs, mfs, ['a']);
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, a, gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'a');
    const uu = {};
    for (const name of ['M', 'E', 'T', 'PX', 'H']) uu[name] = gl.getUniformLocation(pr, name);
    return { draw(m, e, t) {
      gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, 16, 0);
      gl.uniformMatrix4fv(uu.M, false, m);
      gl.uniform3f(uu.E, e[0], e[1], e[2]);
      gl.uniform1f(uu.T, t);
      gl.uniform3f(uu.H, 0.58, 0.90, 0.97);
      gl.uniform1f(uu.PX, Math.hypot(m[1], m[5], m[9]) * gl.drawingBufferHeight * 0.5);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);
      gl.drawArrays(gl.POINTS, 0, N);
      gl.depthMask(true);
      gl.disable(gl.BLEND);
      gl.disableVertexAttribArray(loc);
    }};
  })();

  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(1, 1, 1, 1);
  const M = new Float32Array(16);
  let roll = 0;
  function look(e, tg, fov, w, h) {
    const f = norm(sub(tg, e));
    const r0 = norm(cross(f, [0, 1, 0]));
    const u0 = cross(r0, f);
    const cs = Math.cos(roll), sn = Math.sin(roll);
    const r = add(mul(r0, cs), mul(u0, sn));
    const up = sub(mul(u0, cs), mul(r0, sn));
    const n = 1 / Math.tan(fov * Math.PI / 360);
    const near = 0.35, far = 900, asp = w / Math.max(1, h);
    const Pa = (far + near) / (near - far), Pb = 2 * far * near / (near - far), fe = dot(f, e);
    M[0] = r[0] * n / asp; M[1] = up[0] * n; M[2] = -f[0] * Pa; M[3] = f[0];
    M[4] = r[1] * n / asp; M[5] = up[1] * n; M[6] = -f[1] * Pa; M[7] = f[1];
    M[8] = r[2] * n / asp; M[9] = up[2] * n; M[10] = -f[2] * Pa; M[11] = f[2];
    M[12] = -dot(r, e) * n / asp; M[13] = -dot(up, e) * n; M[14] = Pa * fe + Pb; M[15] = -fe;
  }

  const STOPS = [
    { e: [6, 11, 62], t: [28, 28, 5], f: 46, roll: -0.05 },
    { e: [18, 15, 48], t: [42, 36, 3], f: 42, roll: -0.025 },
    { e: [32, 20, 38], t: [54, 44, 1], f: 40, roll: 0.0 },
    { e: [44, 30, 32], t: [62, 50, -1], f: 38, roll: 0.018 },
    { e: [12, 13, 70], t: [40, 32, 4], f: 50, roll: -0.035 },
  ];
  const cr = (a, b, c, d, t) => 0.5 * (2 * b + (c - a) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (3 * b - a - 3 * c + d) * t * t * t);
  function sample(u, pick) {
    const N = STOPS.length - 1;
    const x = Math.min(Math.max(u, 0), 0.9999) * N;
    const i = Math.floor(x), t = x - i;
    const at = k => pick(STOPS[Math.max(0, Math.min(N, k))]);
    const a = at(i - 1), b = at(i), c = at(i + 1), d = at(i + 2);
    return Array.isArray(b) ? b.map((_, k) => cr(a[k], b[k], c[k], d[k], t)) : cr(a, b, c, d, t);
  }

  let cssW = 0, cssH = 0;
  function fit() {
    const w = innerWidth, h = innerHeight;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    if (w === cssW && h === cssH && cv.width) return;
    cssW = w; cssH = h;
    cv.width = Math.max(1, Math.round(w * dpr));
    cv.height = Math.max(1, Math.round(h * dpr));
    gl.viewport(0, 0, cv.width, cv.height);
  }
  const maxS = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);
  if (AT != null) {
    window.scrollTo(0, AT * maxS());
  }
  let sy = window.scrollY;
  let cur = AT != null ? (window.scrollY / maxS()) : Math.min(1, sy / maxS());
  addEventListener('scroll', () => { sy = window.scrollY; }, { passive: true });
  addEventListener('resize', () => { fit(); }, { passive: true });

  let intro = (RM || STILL) ? 1 : 0;
  let tAcc = STILL ? 1.15 : 0;
  let last = 0;
  function draw(now) {
    const dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016);
    last = now;
    if (!RM && !STILL) tAcc += dt;
    const goal = Math.min(1, sy / maxS());
    if (STILL || RM) cur = goal;
    else cur += (goal - cur) * (1 - Math.exp(-dt * 7));
    if (intro < 1) intro = Math.min(1, intro + dt / 1.45);
    fit();
    let e = sample(cur, s => s.e).slice();
    let tg = sample(cur, s => s.t).slice();
    let fov = sample(cur, s => s.f);
    roll = sample(cur, s => s.roll);
    /* screen-right: truck eye+target left together */
    e[0] -= 5.0;
    tg[0] -= 5.0;
    const portrait = cv.width < cv.height;
    if (portrait) fov = Math.min(78, fov * 1.38);
    if (!STILL && !RM) {
      e[0] += Math.sin(tAcc * 0.17) * 0.5;
      e[1] += Math.sin(tAcc * 0.13 + 1.2) * 0.22;
      e[2] += Math.cos(tAcc * 0.11) * 0.35;
    }
    const lift = 1 - intro;
    const ease = lift * lift * (3 - 2 * lift);
    e[1] += ease * 26;
    tg[1] += ease * 26;
    look(e, tg, fov, cv.width, cv.height);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(0);
    gl.enableVertexAttribArray(1);
    gl.enableVertexAttribArray(2);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 12);
    gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 32, 24);
    gl.uniformMatrix4fv(uM, false, M);
    gl.uniform3f(uE, e[0], e[1], e[2]);
    gl.uniform3f(uB, 1, 1, 1);
    gl.uniform3f(uN, NCOL[0], NCOL[1], NCOL[2]);
    gl.uniform1f(uT, tAcc);
    gl.uniform1f(uF, tAcc);
    gl.drawArrays(gl.TRIANGLES, 0, COUNT);
    if (elevCab) elevCab.draw(M, e, RM || STILL ? 1.15 : tAcc, uM, uE, uB, uN, uT, uF, prog);
    motes.draw(M, e, RM || STILL ? 1.15 : tAcc);
  }
  fit();
  draw(performance.now());
  const loop = now => { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);

  /* grain tile, same family as the reference page */
  {
    const N = 159, c = document.createElement('canvas');
    c.width = c.height = N;
    const x = c.getContext('2d'), img = x.createImageData(N, N), a = img.data;
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0, y = 0; y < N; y++) for (let e = 0; e < N; e++, i += 4) {
      const r = rnd();
      let v = [0, 0, 0, 0];
      if (r < 0.1) v = [10, 48, 72, 13 + rnd() * 18];
      else if (r < 0.18) v = [255, 255, 255, 28 + rnd() * 40];
      if (r > 0.2 && r < 0.206) v = [80, 210, 220, 64];
      if (y % 3 === 2 && v[3] < 8) v = [10, 50, 78, 8];
      a[i] = v[0]; a[i + 1] = v[1]; a[i + 2] = v[2]; a[i + 3] = v[3];
    }
    x.putImageData(img, 0, 0);
    const G = document.getElementById('grade');
    G.style.backgroundImage = `url(${c.toDataURL()})`;
    if ((devicePixelRatio || 1) >= 1.5) G.style.backgroundSize = `${N / 2}px ${N / 2}px`;
  }
  {
    const art = k => {
      const c = document.createElement('canvas');
      c.width = 15 * k; c.height = 21 * k;
      const x = c.getContext('2d');
      x.fillStyle = '#000';
      x.fillRect(5 * k, 0, 5 * k, 21 * k);
      x.fillRect(0, 4 * k, 15 * k, 5 * k);
      x.fillStyle = '#fff';
      x.fillRect(6 * k, k, 3 * k, 19 * k);
      x.fillRect(k, 5 * k, 13 * k, 3 * k);
      return `url(${c.toDataURL()})`;
    };
    const one = art(1);
    const set = `image-set(${one} 1x, ${art(2)} 2x) 7 6, move`;
    const root = document.documentElement;
    root.style.setProperty('--xcur', CSS.supports('cursor', set) ? set : one + ' 7 6, move');
    const df = set.replace(', move', ', default');
    root.style.setProperty('--xdef', CSS.supports('cursor', df) ? df : one + ' 7 6, default');
  }


})();
</script>
