<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<style>
/* Ice-blue void, grain and vignette over a fixed WebGL scene. */
:root{
  --aqua:#7fd9e4;
  --pale:#e9fbfc;
  --line:#4fb9c9;
  --deep:#0b3a4e;
  --panel:#bfeef2;
}
html,body{margin:0;background:#fff;color:var(--deep)}
html{scrollbar-width:none}
body{overflow-x:hidden;min-height:100%}
body::-webkit-scrollbar{display:none}
#gl{
  position:fixed;inset:0;width:100%;height:100%;
  display:block;z-index:0;pointer-events:none;
}
#vig{
  position:fixed;inset:0;z-index:30;pointer-events:none;
  background:radial-gradient(ellipse at 48% 40%, transparent 64%, rgba(10,40,64,.08) 100%);
}
#grade{
  position:fixed;left:-140px;top:-140px;width:calc(100vw + 280px);height:calc(100vh + 280px);
  z-index:31;pointer-events:none;will-change:transform;
  animation:grain .48s steps(1) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)}
  25%{transform:translate(61px,-36px)}
  50%{transform:translate(-43px,72px)}
  75%{transform:translate(29px,48px)}
}
@media (prefers-reduced-motion:reduce){#grade{animation:none}}

#page{position:relative;z-index:1;height:480vh}


/* Left-column typography. Windows are opaque ice-blue paper, not glass. */
:root{
  --mute:#3f7486;
  --disp:"Iowan Old Style",Palatino,"Palatino Linotype","EB Garamond","Noto Serif Display","Noto Serif CJK SC",Georgia,serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC","Noto Sans",system-ui,sans-serif;
  --px:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,"Noto Sans Mono CJK SC",Consolas,monospace;
}
#home{
  position:fixed;left:0;top:0;bottom:0;
  width:min(40vw,500px);
  z-index:20;pointer-events:none;
  box-sizing:border-box;
}
#nm, #home .beat{
  position:absolute;
  left:max(32px, 3.8vw);
  width:min(332px, calc(100% - 52px));
  will-change:opacity,transform;
}
#nm{
  top:50%;
  margin:0;
  color:var(--deep);
  font-family:var(--disp);
  font-weight:400;
  font-size:clamp(64px, 8.2vw, 100px);
  font-synthesis:none;
  line-height:.88;
  letter-spacing:-.038em;
  transform-origin:left center;
  opacity:var(--v,1);
  transform:translate3d(0, calc(-50% + var(--dy, 0px)), 0) scale(var(--sc, 1));
}
#home .beat{
  top:36%;
  width:max-content;
  max-width:min(300px, calc(100% - 52px));
  opacity:var(--v,0);
  transform:translate3d(0, calc(-50% + (1 - var(--v, 0)) * 18px), 0);
}
.win{
  background:var(--pale);
  border:2px solid var(--aqua);
  outline:1px solid var(--line);
  box-shadow:7px 7px 0 rgba(11,58,78,.2);
  display:flex;flex-direction:column;
  min-width:0;
}
.bar{
  display:flex;align-items:center;
  box-sizing:border-box;
  min-height:26px;
  padding:4px 10px;
  background:var(--aqua);
  color:var(--deep);
  font:400 12px/1 var(--px);
  letter-spacing:.06em;
  text-transform:uppercase;
  -webkit-font-smoothing:none;
  font-variant-ligatures:none;
  user-select:none;
}
.bar h2{margin:0;font:inherit;color:inherit;white-space:nowrap}
.win .body{padding:14px 16px 16px;color:var(--deep)}
#edu.beat{max-width:min(400px, calc(100% - 52px))}
#edu .body{display:flex;flex-direction:column;gap:12px}
#edu .row{margin:0;display:flex;flex-direction:row;align-items:center;gap:10px}
#edu .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
#edu .sch-mark{
  display:block;flex:0 0 60px;width:60px;height:60px;
}
#edu .sch{
  font:400 15px/1.3 var(--sans);
  color:var(--deep);
}
#edu .deg{
  font:400 12px/1 var(--px);
  color:var(--mute);
  letter-spacing:.04em;
  -webkit-font-smoothing:none;
}
#edu .maj{
  margin:2px 0 0;
  padding-top:10px;
  border-top:1px solid var(--panel);
  font:400 14px/1.3 var(--sans);
  color:var(--deep);
}
#job.beat{max-width:min(380px, calc(100% - 52px))}
#job .body p{
  margin:0;
  font:400 16px/1.55 var(--sans);
  color:var(--deep);
}
#caps{
  display:flex;flex-direction:column;align-items:flex-start;gap:12px;
  pointer-events:auto;
  max-width:min(360px, calc(100% - 52px));
}
#home #caps{
  transform:translate3d(0, calc(var(--caps-ay, -50%) + (1 - var(--v, 0)) * 18px), 0);
}
#caps .bar{width:auto;}
#caps ul{
  display:flex;flex-direction:column;align-items:flex-start;gap:16px;
  margin:0;padding:0;list-style:none;
}
#caps li{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;align-items:flex-start}
#caps li:nth-child(2){margin-left:10px}
#caps li:nth-child(3){margin-left:4px}
#caps .chip{
  background:var(--pale);
  border:2px solid var(--aqua);
  outline:1px solid var(--line);
  box-shadow:5px 5px 0 rgba(11,58,78,.18);
  padding:8px 12px 7px;
  color:var(--deep);
  font:400 13px/1 var(--px);
  letter-spacing:.02em;
  -webkit-font-smoothing:none;
  font-variant-ligatures:none;
  display:inline-block;
}
#caps button.chip{
  cursor:pointer;
  margin:0;
  appearance:none;
  -webkit-appearance:none;
  font:400 13px/1 var(--px);
  letter-spacing:.02em;
  color:var(--deep);
  text-align:left;
  transition:opacity .4s cubic-bezier(.16,1,.3,1);
}
#caps button.chip:hover,
#caps button.chip[aria-expanded="true"]{opacity:.86}
#caps li{min-height:0}
#caps .panel-slot{
  display:grid;
  grid-template-rows:0fr;
  opacity:0;
  transform:translate3d(0,-10px,0);
  overflow:hidden;
  padding:0;
  margin:0;
  min-height:0;
  transition:
    grid-template-rows .66s cubic-bezier(.16,1,.3,1),
    opacity .5s cubic-bezier(.16,1,.3,1),
    transform .66s cubic-bezier(.16,1,.3,1);
  pointer-events:none;
}
#caps[data-open="agent"] #slot-agent,
#caps[data-open="design"] #slot-design,
#caps[data-open="creativity"] #slot-creativity{
  grid-template-rows:1fr;
  opacity:1;
  transform:translate3d(0,0,0);
  pointer-events:auto;
}
#slot-design,
#slot-creativity{
  opacity:1;
  transform:none;
}
#caps .panel-slot > .panel{
  min-height:0;
  overflow:hidden;
  margin:0;
}
#caps .panel-slot > #panel-design{
  overflow:hidden;
}
#caps[data-open="design"] #slot-design.is-settled,
#caps[data-open="design"] #slot-design.is-settled > #panel-design{
  overflow:visible;
}
#panel-agent{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
  margin:0;
  padding:0 0 4px;
}
#panel-agent::before{content:"";display:block;flex:none;width:0;height:16px}
#caps .entry,
#caps .soon{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--deep);
  text-decoration:none;
  font:400 13px/1 var(--px);
  letter-spacing:.02em;
  -webkit-font-smoothing:none;
  font-variant-ligatures:none;
  pointer-events:auto;
  margin:0;
  padding:0;
}
#caps a.entry:hover{color:var(--line)}
#caps .ico{
  width:36px;height:16px;
  flex:0 0 36px;
  display:grid;
  place-items:center start;
  box-sizing:border-box;
  color:var(--deep);
}
#caps .ico svg{display:block;width:16px;height:16px}
#caps .ico img{display:block;width:36px;height:12px;object-fit:contain}
#caps .soon{
  color:var(--mute);
  pointer-events:none;
  user-select:none;
}
#caps .soon span:last-child{letter-spacing:.14em}
#panel-agent .entry,
#panel-agent .soon{
  opacity:0;
  transform:translate3d(0,8px,0);
  transition:
    opacity .5s cubic-bezier(.16,1,.3,1),
    transform .58s cubic-bezier(.16,1,.3,1);
}
#caps[data-open="agent"] #panel-agent .entry,
#caps[data-open="agent"] #panel-agent .soon{
  opacity:1;
  transform:none;
}
#caps[data-open="agent"] #panel-agent .entry:nth-child(1){transition-delay:.08s}
#caps[data-open="agent"] #panel-agent .entry:nth-child(2){transition-delay:.16s}
#caps[data-open="agent"] #panel-agent .soon{transition-delay:.24s}
#panel-design{
  display:block;
  margin:0;
  padding:0;
}
#panel-design .fan{
  position:relative;
  width:220px;
  height:260px;
  margin:26px 22px 22px 6px;
}
#panel-design .dcard{
  --hx:0px;
  --hy:0px;
  position:absolute;
  left:0;top:0;
  width:168px;
  margin:0;
  padding:3px;
  background:var(--pale);
  border:2px solid var(--aqua);
  outline:none;
  box-shadow:
    0 0 0 1px var(--line),
    5px 5px 0 rgba(11,58,78,.16);
  transform-origin:center center;
  transition:
    transform .66s cubic-bezier(.22,.8,.28,1),
    box-shadow .72s cubic-bezier(.16,1,.3,1);
  overflow:hidden;
  cursor:default;
}
#panel-design .dcard::after{
  content:"";
  position:absolute;inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(-18deg, rgba(11,58,78,.02) 0 1px, transparent 1px 4px);
  opacity:.35;
}
#panel-design .dcard img{
  display:block;
  width:100%;
  height:auto;
  vertical-align:middle;
}
/* Closed: a single pile, top card in front. Open: the pile is drawn apart as the slot uncovers it. */
#panel-design .dcard:nth-child(1){transform:rotate(-1.1deg) translate(0px,0px);z-index:3}
#panel-design .dcard:nth-child(2){transform:rotate(1deg) translate(5px,6px);z-index:2}
#panel-design .dcard:nth-child(3){transform:rotate(-.5deg) translate(2px,11px);z-index:1}
#caps[data-open="design"] #panel-design .dcard:nth-child(1){
  --hx:0px;--hy:0px;
  transform:rotate(-2.4deg) translate(0px,0px);z-index:1;
  transition-delay:0s;
}
#caps[data-open="design"] #panel-design .dcard:nth-child(2){
  --hx:16px;--hy:62px;
  transform:rotate(1deg) translate(16px,62px);z-index:2;
  transition-delay:.07s;
}
#caps[data-open="design"] #panel-design .dcard:nth-child(3){
  --hx:6px;--hy:126px;
  transform:rotate(2.8deg) translate(6px,126px);z-index:3;
  transition-delay:.14s;
}
#caps[data-open="design"] #panel-design .dcard:hover,
#caps[data-open="design"] #panel-design .dcard:focus-within{
  transform:rotate(0deg) translate(var(--hx), calc(var(--hy) - 14px)) scale(1.035);
  z-index:6;
  transition-delay:0s;
  box-shadow:
    0 0 0 1px var(--line),
    10px 18px 0 rgba(11,58,78,.15),
    0 16px 26px rgba(11,58,78,.14);
}
#panel-creativity{
  margin:0;
  padding:0;
}
.create-stage{
  position:relative;
  width:min(292px, calc(100vw - 64px));
  height:min(400px, 54vh);
  margin:16px 0 0 -8px;
  box-sizing:border-box;
  background:transparent;
  border:0;
  box-shadow:none;
  overflow:visible;
  pointer-events:auto;
}
.create-stage::after{ content:none; display:none; }
#mark-create{
  display:block;
  width:100%;
  height:100%;
}
html.still #caps .panel-slot,
html.still #panel-agent .entry,
html.still #panel-agent .soon,
html.still #panel-design .dcard{
  transition:none;
}
@media (prefers-reduced-motion:reduce){
  #caps .panel-slot,
  #panel-agent .entry,
  #panel-agent .soon,
  #panel-design .dcard{
    transition:none;
  }
}
#home #feat{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:0;
}
#feat .win{
  width:min(280px, calc(100vw - 64px));
  box-sizing:border-box;
}
#feat .sg-body{
  display:flex;align-items:center;justify-content:center;
  padding:14px 16px 16px;
}
#feat .sg-row{
  display:flex;align-items:center;gap:7px;
}
#feat .sg-mark{display:block;flex:0 0 88px;width:88px;height:88px}
#feat .sg-name{
  margin:0;
  color:var(--deep);
  font-family:var(--disp);
  font-weight:400;
  font-size:28px;
  line-height:1;
  letter-spacing:-.03em;
}
#feat .sg-links{
  display:flex;
  align-items:center;
  gap:14px;
  margin-left:16px;
  margin-top:44px;
}
#feat .sg-gh,
#feat .sg-yt{
  pointer-events:auto;
  color:var(--deep);
  display:inline-flex;align-items:center;
  line-height:0;
  text-decoration:none;
}
#feat .sg-gh svg,
#feat .sg-yt svg{display:block;width:24px;height:24px}
#feat .sg-gh:hover,
#feat .sg-yt:hover{color:#0b3a4e;opacity:.78}
@media (prefers-reduced-motion:reduce){
  #nm,#home .beat{will-change:auto}
}
@media (max-aspect-ratio:1/1){
  #home{width:min(72vw, 380px)}
  #nm, #home .beat{left:max(20px, 4vw);width:min(300px, calc(100% - 36px))}
  #nm{top:22%;font-size:clamp(52px, 14vw, 80px)}
  #home .beat{top:32%}
  #edu.beat{max-width:min(320px, calc(100% - 36px))}
  #job.beat{max-width:min(320px, calc(100% - 36px))}
  #edu .sch-mark{flex-basis:52px;width:52px;height:52px}
  #feat .sg-mark{flex-basis:72px;width:72px;height:72px}
  #feat .sg-name{font-size:24px}
}
</style>
</head>

precision highp float;

    return null;
  }

  /* flicker: frequent while a particle is being written; still blinks after it settles */
  function flick(pt, t){
    if (RM || STILL) return 1;
    const age = t - pt.born;
    if (age < 0) return 0;
    const cell = Math.floor(t * (pt.glyph ? 16 : 13) + pt.id * 0.17);
    const n = hash(cell * 97 + pt.id);
    const n2 = hash(cell * 13 + pt.id * 3);
    if (age < pt.settle){
      /* writing: hard on/off flicker */
      if (n < 0.38) return 0;
      if (n2 < 0.18) return 0.25;
      return 1;
    }
    /* settled: still frequent small blinks, glyphs more often */
    const rate = pt.glyph ? 0.14 : 0.07;
    if (n < rate) return n < rate*0.45 ? 0 : 0.2;
    return 1;
  }

  /* ---- construction / design drawings ---- */
  const PLATE = { top: 548, bot: -24, padX: 170 / 1.1, insetTop: 28, insetBot: 32, label: 20 };

  function artboard(){
    /* a design plate around the plant, in screen space */
    const top = project(v3(0, PLATE.top, 0));
    const base = project(v3(0, PLATE.bot, 0));
    const padX = PLATE.padX * S;
    const x0 = CX - padX, x1 = CX + padX;
    const y0 = top.y - PLATE.insetTop, y1 = base.y + PLATE.insetBot;
    return { x0, y0, x1, y1, w: x1-x0, h: y1-y0 };
  }

  function drawCropMark(x, y, dx, dy, a){
    ctx.strokeStyle = rgba(deep, a);
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(x, y+dy*14); ctx.lineTo(x, y); ctx.lineTo(x+dx*14, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + dx*5, y + dy*5, 3.2, 0, Math.PI*2);
    ctx.stroke();
  }

  function dashLine(x0,y0,x1,y1, a, dash){
    ctx.save();
    ctx.strokeStyle = rgba(line, a);
    ctx.lineWidth = 0.7;
    ctx.setLineDash(dash || [3, 3.5]);
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    ctx.restore();
  }

  function solidLine(x0,y0,x1,y1, a, w){
    ctx.strokeStyle = rgba(deep, a);
    ctx.lineWidth = w||0.8;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  }

  function drawLabel(text, x, y, a, align){
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = deep;
    ctx.font = `${Math.max(9, 10*S/1.1)}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function grownBlade(spec, grow, lean, origin, up){
    const isLeaf = spec.kind==='leaf';
    const lenK = isLeaf ? lerp(0.16,1,grow) : lerp(0.48,1,grow);
    const widK = isLeaf ? lerp(0.10,1,Math.pow(grow,0.75)) : lerp(0.40,1,grow);
    return Object.assign({}, spec, { len: spec.len*lenK, wid: spec.wid*widK });
  }
  function bladeSamples(spec, grow, lean, origin, up){
    const grown = grownBlade(spec, grow, lean, origin, up);
    const root = project(origin);
    const tip = project(bladePoint(1,0,grown,lean,origin,up));
    const L = project(bladePoint(0.52,-1,grown,lean,origin,up));
    const R = project(bladePoint(0.52, 1,grown,lean,origin,up));
    const outline = [];
    const us = [0.08,0.22,0.38,0.52,0.68,0.82,0.94,1];
    for (let i=0;i<us.length;i++){
      outline.push(project(bladePoint(us[i],-1,grown,lean,origin,up)));
      outline.push(project(bladePoint(us[i], 1,grown,lean,origin,up)));
    }
    return { root, tip, L, R, outline, grown };
  }
  function obbFromBlade(samp, pad){
    pad = pad==null ? 7 : pad;
    const dx = samp.tip.x-samp.root.x, dy = samp.tip.y-samp.root.y;
    const L = Math.hypot(dx,dy)||1;
    const ux = dx/L, uy = dy/L;
    const vx = -uy, vy = ux;
    let minU=0, maxU=0, minV=0, maxV=0;
    const pts = [samp.root, samp.tip, samp.L, samp.R].concat(samp.outline);
    for (let i=0;i<pts.length;i++){
      const p=pts[i];
      const u=(p.x-samp.root.x)*ux+(p.y-samp.root.y)*uy;
      const v=(p.x-samp.root.x)*vx+(p.y-samp.root.y)*vy;
      if (u<minU) minU=u; if (u>maxU) maxU=u;
      if (v<minV) minV=v; if (v>maxV) maxV=v;
    }
    minU-=pad; maxU+=pad; minV-=pad; maxV+=pad;
    const corner=(u,v)=>({x:samp.root.x+u*ux+v*vx, y:samp.root.y+u*uy+v*vy});
    return {
      c:[corner(minU,minV), corner(maxU,minV), corner(maxU,maxV), corner(minU,maxV)],
      tip:samp.tip, root:samp.root, L:samp.L, R:samp.R,
      far: corner(maxU, (minV+maxV)/2)
    };
  }
  function drawObb(obb, a, label){
    if (!obb || a<=0.02) return;
    ctx.save();
    ctx.strokeStyle = rgba(aqua, a);
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(obb.c[0].x, obb.c[0].y);
    for (let i=1;i<4;i++) ctx.lineTo(obb.c[i].x, obb.c[i].y);
    ctx.closePath();
    ctx.stroke();
    const hs=2.2;
    for (let i=0;i<4;i++){
      const p=obb.c[i];
      ctx.fillStyle = rgba(deep, a*1.45);
      ctx.fillRect(p.x-hs,p.y-hs,hs*2,hs*2);
    }
    ctx.strokeStyle = rgba(deep, a*0.95);
    ctx.lineWidth = 0.7;
    ctx.strokeRect(obb.tip.x-2.3, obb.tip.y-2.3, 4.6, 4.6);
    if (label && a>0.14){
      drawLabel(label, obb.far.x+6, obb.far.y, a*0.95, 'left');
    }
    ctx.restore();
  }
  function scaleObb(obb, k, origin){
    const o = origin || obb.root;
    const p = (q)=>({ x: o.x+(q.x-o.x)*k, y: o.y+(q.y-o.y)*k });
    return { c: obb.c.map(p), tip:p(obb.tip), root:o, L:p(obb.L), R:p(obb.R), far:p(obb.far) };
  }
  function leafTip(t, i){
    const spec = LEAVES[i];
    const g = Math.max(0.08, leafGrow(t, i));
    const samp = bladeSamples(spec, g, lerp(8*D, spec.openLean, g), stemPoint(spec.node), stemTan(spec.node));
    return samp.tip;
  }
  function plotterAt(t){
    /* sit on the construction being written: first the spreading frame, then the growth inside it */
    if (t < T.stemFrame0) return project(stemPoint(0));
    if (t < T.stem0) return project(stemPoint(smoother(gate(t, T.stemFrame0, T.stemFrame1))));
    if (t < T.stem1) return project(stemPoint(smoother(gate(t, T.stem0, T.stem1))));
    for (let i=0;i<LEAF_T.length;i++){
      const L = LEAF_T[i];
      if (t < L.grow1 + 0.15){
        const spec = LEAVES[i];
        if (t < L.grow0){
          const k = Math.max(0.08, leafFrame(t,i).spread);
          const samp = bladeSamples(spec, 1, spec.openLean, stemPoint(spec.node), stemTan(spec.node));
          const obb = scaleObb(obbFromBlade(samp, 6), k, samp.root);
          return obb.tip;
        }
        return leafTip(t, i);
      }
    }
    let best=null, bestScore=-1;
    for (let i=0;i<PETALS.length;i++){
      const spec=PETALS[i];
      const ph=petalPhase(t, i);
      if (ph.frameA<=0.02 && ph.open<=0) continue;
      const mid = ph.open<=0 ? ph.frameSpread : (1-Math.abs(ph.open-0.55));
      if (mid>bestScore){ bestScore=mid; best={spec, ph}; }
    }
    if (!best) return project(stemPoint(1));
    const {spec, ph} = best;
    if (ph.open<=0.02){
      const samp = bladeSamples(spec, 1, spec.openLean, stemPoint(1), stemTan(1));
      return scaleObb(obbFromBlade(samp, 5), Math.max(0.08, ph.frameSpread), samp.root).tip;
    }
    const lean = lerp(6*D, spec.openLean, ph.open);
    return bladeSamples(spec, Math.max(0.2, ph.bud), lean, stemPoint(1), stemTan(1)).tip;
  }

  function drawConstruction(t){
    const f = smoother(gate(t, T.frame0, T.frame1));
    if (f<=0) return;
    const b = artboard();
    const fa = 0.22 + 0.55*f;
    /* flicker the plate slightly, like a redraw */
    const blink = (RM||STILL) ? 1 : (hash(Math.floor(t*11)+3) < 0.08 ? 0.45 : 1);
    const a = fa * blink;

    /* crop / registration marks — a design frame, not a box */
    drawCropMark(b.x0, b.y0,  1,  1, a);
    drawCropMark(b.x1, b.y0, -1,  1, a);
    drawCropMark(b.x0, b.y1,  1, -1, a);
    drawCropMark(b.x1, b.y1, -1, -1, a);

    /* edge rulers */
    const ticks = 12;
    for (let i=0;i<=ticks;i++){
      const u=i/ticks;
      const x = lerp(b.x0, b.x1, u);
      const y = lerp(b.y1, b.y0, u);
      const big = i%3===0;
      solidLine(x, b.y1, x, b.y1+(big?8:4), a*(big?0.85:0.4), 0.6);
      solidLine(b.x0, y, b.x0-(big?8:4), y, a*(big?0.85:0.4), 0.6);
    }
    if (f>0.6){
      drawLabel('00', b.x0-22, b.y1+20, a*0.7, 'center');
      drawLabel('01', b.x1+22, b.y1+20, a*0.7, 'center');
      drawLabel('10', b.x0-22, b.y0-18, a*0.7, 'center');
      drawLabel('11', b.x1+22, b.y0-18, a*0.7, 'center');
    }

    /* vertical construction axis */
    const stemU = (t < T.stemFrame0) ? 0 : (t < T.stem0 ? smoother(gate(t, T.stemFrame0, T.stemFrame1)) : 1);
    if (stemU>0){
      const p0 = project(stemPoint(0));
      const p1 = project(stemPoint(stemU));
      /* draw the spline as a construction stroke */
      ctx.save();
      const guideA = (0.35 + 0.65*(1 - smoother(gate(t, T.stem1, T.stem1+2.0)))) * blink;
      ctx.strokeStyle = rgba(deep, 0.28*guideA);
      ctx.lineWidth = 0.8;
      ctx.setLineDash([2.5, 2.5]);
      ctx.beginPath();
      const n = Math.max(4, Math.round(40*stemU));
      for (let i=0;i<=n;i++){
        const q = project(stemPoint((i/n)*stemU));
        if (i===0) ctx.moveTo(q.x,q.y); else ctx.lineTo(q.x,q.y);
      }
      ctx.stroke();
      ctx.restore();
      /* control points, like a bezier being edited */
      const handleA = (1 - smoother(gate(t, T.stem1+0.2, T.stem1+1.6))) * blink;
      const cps = [STEM.p0, STEM.p1, STEM.p2, STEM.p3].map(project);
      const shown = 1 + Math.floor(stemU*3);
      if (handleA>0.03){
        for (let i=0;i<shown && i<cps.length;i++){
          const q=cps[i];
          ctx.strokeStyle = rgba(line, 0.55*handleA);
          ctx.lineWidth = 0.7;
          ctx.strokeRect(q.x-3, q.y-3, 6, 6);
          if (i>0) dashLine(cps[i-1].x,cps[i-1].y,q.x,q.y, 0.25*handleA, [2,3]);
        }
      }
      /* height dimension: live while the stem is written, then put away */
      const dimA = (1 - smoother(gate(t, T.stem1+0.12, T.stem1+0.85))) * blink;
      if (dimA > 0.03){
        const dimX = b.x1 - 22;
        const top = project(stemPoint(stemU));
        const bot = project(stemPoint(0));
        dashLine(top.x+8, top.y, dimX, top.y, 0.3*dimA, [2,3]);
        dashLine(bot.x+8, bot.y, dimX, bot.y, 0.3*dimA, [2,3]);
        solidLine(dimX, top.y, dimX, bot.y, 0.45*dimA, 0.7);
        solidLine(dimX-4, top.y, dimX+4, top.y, 0.45*dimA, 0.7);
        solidLine(dimX-4, bot.y, dimX+4, bot.y, 0.45*dimA, 0.7);
        const hh = Math.round(stemU*412);
        drawLabel(String(hh).padStart(3,'0'), dimX+10, (top.y+bot.y)/2, 0.55*dimA, 'left');
      }
      /* bezier handles fade once the stem is committed */
      /* (control squares already drawn above; fade them with dimA after stem) */
    }

    /* each leaf: empty frame spreads to its final size first, then the leaf grows inside it */
    const leafLabel = ['01','10'];
    LEAVES.forEach((spec,i)=>{
      const fr = leafFrame(t,i);
      if (fr.alpha<=0.03) return;
      const origin = stemPoint(spec.node);
      const up = stemTan(spec.node);
      const samp = bladeSamples(spec, 1, spec.openLean, origin, up);
      const k = Math.max(0.06, fr.spread);
      const obb = scaleObb(obbFromBlade(samp, 6), k, samp.root);
      dashLine(obb.root.x,obb.root.y,obb.tip.x,obb.tip.y, 0.4*fr.alpha*blink, [2,3]);
      dashLine(obb.L.x,obb.L.y,obb.R.x,obb.R.y, 0.28*fr.alpha*blink, [2,3]);
      drawObb(obb, 0.52*fr.alpha*blink, leafLabel[i]);
    });

    /* bud: a shared construction at the receptacle, not a shot of the whole flower */
    const bud = smoother(gate(t, T.bud0-0.25, T.bud1));
    const receptacleA = (1 - smoother(gate(t, T.open0, T.open0+1.6))) * blink;
    if (bud>0 && receptacleA>0.03){
      const o = project(stemPoint(1));
      const rad = lerp(14, 36, bud) * S * 0.9;
      ctx.save();
      ctx.strokeStyle = rgba(line, 0.32*receptacleA);
      ctx.lineWidth = 0.7;
      ctx.setLineDash([2.5, 3]);
      ctx.beginPath(); ctx.arc(o.x, o.y, rad, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(o.x, o.y, rad*0.55, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    /* each petal: empty frame spreads to the final open size, then the petal unfurls into it */
    PETALS.forEach((spec, i)=>{
      const ph = petalPhase(t, i);
      if (ph.frameA<=0.03) return;
      const samp = bladeSamples(spec, 1, spec.openLean, stemPoint(1), stemTan(1));
      const k = Math.max(0.06, ph.frameSpread);
      const obb = scaleObb(obbFromBlade(samp, 5), k, samp.root);
      const o = project(stemPoint(1));
      dashLine(o.x, o.y, obb.tip.x, obb.tip.y, 0.28*ph.frameA*blink, [2,3]);
      dashLine(obb.L.x,obb.L.y,obb.R.x,obb.R.y, 0.22*ph.frameA*blink, [2,3]);
      drawObb(obb, 0.48*ph.frameA*blink, null);
    });

    /* a small CAD snap at the writing tip — not a viewfinder */
    const pen = plotterAt(t);
    const penFade = 1 - smoother(gate(t, T.open1, T.open1+1.1));
    if (f>0.4 && penFade>0.04){
      const pa = ((RM||STILL)?0.55:(hash(Math.floor(t*18)+9)<0.35?0.12:0.7)) * penFade;
      ctx.strokeStyle = rgba(deep, pa);
      ctx.lineWidth = 0.8;
      const r=4.5;
      ctx.beginPath(); ctx.moveTo(pen.x-r,pen.y); ctx.lineTo(pen.x+r,pen.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pen.x,pen.y-r); ctx.lineTo(pen.x,pen.y+r); ctx.stroke();
    }
  }

  function drawParticles(t){
    /* back to front */
    const drawn = [];
    for (let i=0;i<parts.length;i++){
      const pt = parts[i];
      if (t < pt.born) continue;
      const w = worldOf(pt, t);
      if (!w) continue;
      const q = project(w);
      const j = jitter(pt, t);
      q.x += j.x; q.y += j.y;
      const fl = flick(pt, t);
      if (fl<=0.02) continue;
      drawn.push({ pt, q, fl });
    }
    drawn.sort((a,b)=> a.q.z-b.q.z);

    ctx.save();
    ctx.font = `${Math.max(7, 9*S/1.15)}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i=0;i<drawn.length;i++){
      const { pt, q, fl } = drawn[i];
      const a = fl * (pt.kind==='dust' ? 0.45 : 0.85);
      if (pt.glyph){
        ctx.fillStyle = rgba(pt.col, a);
        ctx.fillText(pt.glyph, q.x, q.y);
      } else {
        const s = pt.size * (S/1.05);
        ctx.fillStyle = rgba(pt.col, a);
        ctx.fillRect(q.x-s*0.5, q.y-s*0.5, s, s);
      }
    }
    ctx.restore();
  }

  function clock(now, t0){
    if (FT != null) return FT;
    if (RM || STILL) return 24.4;
    return (now - t0) / 1000;
  }

  function render(t){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    /* a faint paper wash, feathered so it does not read as a hard card */
    (function paperWash(){
      const a = 0.36;
      const fade = Math.max(22, Math.min(40, Math.floor(Math.min(W,H)*0.11)));
      const c0 = 'rgba(233,251,252,0)';
      const c1 = `rgba(233,251,252,${a})`;
      ctx.fillStyle = c1;
      ctx.fillRect(fade, fade, Math.max(0, W-2*fade), Math.max(0, H-2*fade));
      let g = ctx.createLinearGradient(0, fade, 0, 0);
      g.addColorStop(0, c1); g.addColorStop(1, c0);
      ctx.fillStyle = g; ctx.fillRect(fade, 0, Math.max(0, W-2*fade), fade);
      g = ctx.createLinearGradient(0, H-fade, 0, H);
      g.addColorStop(0, c1); g.addColorStop(1, c0);
      ctx.fillStyle = g; ctx.fillRect(fade, H-fade, Math.max(0, W-2*fade), fade);
      g = ctx.createLinearGradient(fade, 0, 0, 0);
      g.addColorStop(0, c1); g.addColorStop(1, c0);
      ctx.fillStyle = g; ctx.fillRect(0, fade, fade, Math.max(0, H-2*fade));
      g = ctx.createLinearGradient(W-fade, 0, W, 0);
      g.addColorStop(0, c1); g.addColorStop(1, c0);
      ctx.fillStyle = g; ctx.fillRect(W-fade, fade, fade, Math.max(0, H-2*fade));
      function corner(cx, cy, x, y){
        const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, fade);
        rg.addColorStop(0, c1); rg.addColorStop(1, c0);
        ctx.fillStyle = rg;
        ctx.fillRect(x, y, fade, fade);
      }
      corner(fade, fade, 0, 0);
      corner(W-fade, fade, W-fade, 0);
      corner(fade, H-fade, 0, H-fade);
      corner(W-fade, H-fade, W-fade, H-fade);
    })();

    drawConstruction(t);
    drawParticles(t);

    /* a very quiet running tick, like a plot log */
    if (t > 0.2){
      const blink = (RM||STILL)?1:(hash(Math.floor(t*8)+1)<0.2?0.2:0.7);
      const code = (Math.floor(t*23)%2===0)?'0':'1';
      const b = artboard();
      drawLabel(`GEN  ${code}${code}${(Math.floor(t*10)%2)}`, b.x0+10, b.y1-12, 0.35*blink, 'left');
    }
  }

  let t0 = performance.now();
  let lastOpen = '';
  function start(){
    t0 = performance.now();
    fit();
  }
  seed();
  window.__creativity = {
    tick(now){
      const on = caps.dataset.open === 'creativity';
      if (on && lastOpen !== 'creativity') start();
      lastOpen = on ? 'creativity' : '';
      if (!on) return;
      const r = stage.getBoundingClientRect();
      if (Math.round(r.width) !== lastW || Math.round(r.height) !== lastH) fit();
      if (W < 8 || H < 8) return;
      render(clock(now, t0));
    }
  };
  stage.style.cursor = 'pointer';
  stage.addEventListener('click', () => {
    if (STILL || RM || FT != null) return;
    t0 = performance.now();
  });
  addEventListener('resize', () => {
    if (caps.dataset.open === 'creativity') fit();
  }, { passive: true });
  if (caps.dataset.open === 'creativity') start();
})();


  syncHome(cur, intro);
  fit();
  draw(performance.now());
  const loop = now => { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);

  /* grain tile, same family as the reference page */
  {
    const N = 159, c = document.createElement('canvas');
    c.width = c.height = N;
    const x = c.getContext('2d'), img = x.createImageData(N, N), a = img.data;
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0, y = 0; y < N; y++) for (let e = 0; e < N; e++, i += 4) {
      const r = rnd();
      let v = [0, 0, 0, 0];
      if (r < 0.1) v = [10, 48, 72, 13 + rnd() * 18];
      else if (r < 0.18) v = [255, 255, 255, 28 + rnd() * 40];
      if (r > 0.2 && r < 0.206) v = [80, 210, 220, 64];
      if (y % 3 === 2 && v[3] < 8) v = [10, 50, 78, 8];
      a[i] = v[0]; a[i + 1] = v[1]; a[i + 2] = v[2]; a[i + 3] = v[3];
    }
    x.putImageData(img, 0, 0);
    const G = document.getElementById('grade');
    G.style.backgroundImage = `url(${c.toDataURL()})`;
    if ((devicePixelRatio || 1) >= 1.5) G.style.backgroundSize = `${N / 2}px ${N / 2}px`;
  }
  {
    const art = k => {
      const c = document.createElement('canvas');
      c.width = 15 * k; c.height = 21 * k;
      const x = c.getContext('2d');
      x.fillStyle = '#000';
      x.fillRect(5 * k, 0, 5 * k, 21 * k);
      x.fillRect(0, 4 * k, 15 * k, 5 * k);
      x.fillStyle = '#fff';
      x.fillRect(6 * k, k, 3 * k, 19 * k);
      x.fillRect(k, 5 * k, 13 * k, 3 * k);
      return `url(${c.toDataURL()})`;
    };
    const one = art(1);
    const set = `image-set(${one} 1x, ${art(2)} 2x) 7 6, move`;
    const root = document.documentElement;
    root.style.setProperty('--xcur', CSS.supports('cursor', set) ? set : one + ' 7 6, move');
    const df = set.replace(', move', ', default');
    root.style.setProperty('--xdef', CSS.supports('cursor', df) ? df : one + ' 7 6, default');
  }


})();
</script>
